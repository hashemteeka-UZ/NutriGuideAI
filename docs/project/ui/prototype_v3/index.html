<title>NutriGuide النموذج الثالث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* NutriGuide prototype v3 (v2 + muscle-building path, goal accent, gendered Arabic address). Identity: mint-emerald (health) + sky (tech) on deep slate (dark) or soft mint-white (light).
   Macro colours are fixed everywhere: protein coral, carbs blue, fat amber, fiber green, energy orange, water sky.
   Illustrations: Fluent Emoji Flat (Microsoft, MIT licence), inlined. */
:root{
  --bg:#F3F7F5; --bg-2:#E8F1ED; --surface:#FFFFFF; --surface-2:#F2F6F4; --surface-3:#E7EEEB; --line:#DDE7E3;
  --fg:#0F1D1A; --fg-2:#4A5D58; --fg-3:#7E8F8B;
  --brand:#0FA473; --brand-2:#0B8A61; --brand-soft:#D7F3E8; --on-brand:#FFFFFF;
  --signal:#0EA5E9; --signal-soft:#DCF2FC;
  --kcal:#F2781F; --protein:#E5536A; --carb:#3D7FE6; --fat:#E3A21A; --fiber:#22A866; --water:#1A9BE0;
  --ok:#16A36B; --part:#D99511; --miss:#8A97A3; --warn:#E26A2C; --danger:#D9434F;
  --shadow:0 1px 2px rgba(15,40,30,.05),0 8px 24px rgba(15,40,30,.08);
  --shadow-lg:0 20px 50px rgba(15,40,30,.18);
  --hero:linear-gradient(135deg,#0FA473 0%,#12B39A 45%,#1AA7E0 100%);
  --font-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-num:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111C; --bg-2:#0E1726; --surface:#131D2D; --surface-2:#192538; --surface-3:#203046; --line:#24334A;
  --fg:#EEF3F8; --fg-2:#A7B4C6; --fg-3:#6F7E94;
  --brand:#2BD49A; --brand-2:#5BE3B4; --brand-soft:#123B33; --on-brand:#04241A;
  --signal:#38BDF8; --signal-soft:#0F3148;
  --kcal:#FF9147; --protein:#FF6B81; --carb:#5C9BFF; --fat:#FFC23D; --fiber:#3DD68C; --water:#3FB7F5;
  --ok:#34D399; --part:#FBBF24; --miss:#7C8BA0; --warn:#FB923C; --danger:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --hero:linear-gradient(135deg,#0E8F68 0%,#0F8C86 45%,#1478B8 100%);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A111C; --bg-2:#0E1726; --surface:#131D2D; --surface-2:#192538; --surface-3:#203046; --line:#24334A;
  --fg:#EEF3F8; --fg-2:#A7B4C6; --fg-3:#6F7E94;
  --brand:#2BD49A; --brand-2:#5BE3B4; --brand-soft:#123B33; --on-brand:#04241A;
  --signal:#38BDF8; --signal-soft:#0F3148;
  --kcal:#FF9147; --protein:#FF6B81; --carb:#5C9BFF; --fat:#FFC23D; --fiber:#3DD68C; --water:#3FB7F5;
  --ok:#34D399; --part:#FBBF24; --miss:#7C8BA0; --warn:#FB923C; --danger:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --hero:linear-gradient(135deg,#0E8F68 0%,#0F8C86 45%,#1478B8 100%);
  color-scheme:dark;
}
.app.mode-light{
  --bg:#F3F7F5; --bg-2:#E8F1ED; --surface:#FFFFFF; --surface-2:#F2F6F4; --surface-3:#E7EEEB; --line:#DDE7E3;
  --fg:#0F1D1A; --fg-2:#4A5D58; --fg-3:#7E8F8B;
  --brand:#0FA473; --brand-2:#0B8A61; --brand-soft:#D7F3E8; --on-brand:#FFFFFF; --signal:#0EA5E9; --signal-soft:#DCF2FC;
  --kcal:#F2781F; --protein:#E5536A; --carb:#3D7FE6; --fat:#E3A21A; --fiber:#22A866; --water:#1A9BE0;
  --ok:#16A36B; --part:#D99511; --miss:#8A97A3; --warn:#E26A2C; --danger:#D9434F;
  --shadow:0 1px 2px rgba(15,40,30,.05),0 8px 24px rgba(15,40,30,.08); --shadow-lg:0 20px 50px rgba(15,40,30,.18);
  --hero:linear-gradient(135deg,#0FA473 0%,#12B39A 45%,#1AA7E0 100%); color-scheme:light;
}
.app.mode-dark{
  --bg:#0A111C; --bg-2:#0E1726; --surface:#131D2D; --surface-2:#192538; --surface-3:#203046; --line:#24334A;
  --fg:#EEF3F8; --fg-2:#A7B4C6; --fg-3:#6F7E94;
  --brand:#2BD49A; --brand-2:#5BE3B4; --brand-soft:#123B33; --on-brand:#04241A; --signal:#38BDF8; --signal-soft:#0F3148;
  --kcal:#FF9147; --protein:#FF6B81; --carb:#5C9BFF; --fat:#FFC23D; --fiber:#3DD68C; --water:#3FB7F5;
  --ok:#34D399; --part:#FBBF24; --miss:#7C8BA0; --warn:#FB923C; --danger:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --hero:linear-gradient(135deg,#0E8F68 0%,#0F8C86 45%,#1478B8 100%); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg-2);color:var(--fg);font-family:var(--font-ar);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:10px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.emo{display:inline-block;flex:none;vertical-align:middle}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
[dir=rtl] .flip{transform:scaleX(-1)}

/* stage */
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:20px 16px 40px;flex-wrap:wrap}
.app{width:100%;max-width:420px;height:860px;max-height:calc(100vh - 40px);min-height:660px;background:var(--bg);color:var(--fg);border-radius:36px;
  border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden;position:relative;display:flex;flex-direction:column;isolation:isolate}
@media (max-width:520px){.stage{padding:0}.app{border-radius:0;border:0;max-height:none;height:100vh;height:100dvh;min-height:0}.panel{margin:0 16px 24px}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 18px 120px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes inFwd{from{opacity:0;transform:translateX(calc(var(--dirx)*40px))}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(calc(var(--dirx)*-40px))}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc,var(--brand)) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes ringdraw{from{stroke-dashoffset:var(--c)}}
@keyframes barfill{from{transform:scaleX(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes drop{0%{transform:translate(-50%,-60px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(-50%,120px) scale(1);opacity:0}}
@keyframes wave{to{transform:translateX(-50%)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes bannerIn{from{transform:translateY(-120%)}to{transform:none}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes counter{to{transform:rotate(-360deg)}}
.app[dir=rtl]{--dirx:-1} .app[dir=ltr]{--dirx:1}
.anim.fwd>.scroll,.anim.fwd>.body{animation:inFwd .38s cubic-bezier(.2,.8,.2,1) both}
.anim.back>.scroll,.anim.back>.body{animation:inBack .38s cubic-bezier(.2,.8,.2,1) both}
.anim .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms + 60ms)}
.anim .ringv{animation:ringdraw 1.1s cubic-bezier(.3,.7,.2,1) both .15s}
.anim .barv{transform-origin:var(--origin,right);animation:barfill .9s cubic-bezier(.3,.7,.2,1) both .2s}
[dir=ltr] .barv{--origin:left}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
.press{transition:transform .15s}
.press:active{transform:scale(.96)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:18px 18px 10px}
.top h1{margin:0;font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.2px}
.top .sub{color:var(--fg-3);font-size:13px}
.grow{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg-2);flex:none;position:relative}
.iconbtn .dot{position:absolute;top:9px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:var(--kcal);border:2px solid var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow);position:relative}
.card.flat{box-shadow:none}
.card h2,.h2{margin:0;font-size:17px;font-weight:700}
.tint{--tc:var(--brand);background:color-mix(in srgb,var(--tc) 10%,var(--surface));border-color:color-mix(in srgb,var(--tc) 22%,var(--line))}
.hero{background:var(--hero);color:#fff;border:0;overflow:hidden}
.hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;inset-inline-start:-80px;top:-120px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;inset-inline-end:-60px;bottom:-110px;border:30px solid rgba(255,255,255,.08)}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3);font-size:13px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 2px -4px}
.sec h3{margin:0;font-size:16px;font-weight:700}
.link{color:var(--brand);font-weight:600;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.chip.g{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand-2)}
.app.mode-light .chip.g,:root:not([data-theme=dark]) .app:not(.mode-dark) .chip.g{color:var(--brand-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.info{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--fg-3);font-size:12px;font-weight:700;flex:none;border:1px solid var(--line)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:18px;padding:12px 20px;font-weight:700;font-size:16px;background:var(--brand);color:var(--on-brand);transition:transform .15s,filter .2s,opacity .2s}
.btn:active{transform:scale(.97)} .btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-2)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:40px;font-size:14px;padding:8px 14px;border-radius:14px}
.footer{padding:12px 18px 22px;display:flex;gap:10px;align-items:center;background:linear-gradient(to top,var(--bg) 70%,transparent);position:absolute;inset-inline:0;bottom:0;z-index:3}
.sqbtn{width:58px;height:54px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}

/* segmented */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:12px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--fg-2);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* bottom nav */
.nav{position:absolute;inset-inline:14px;bottom:14px;z-index:4;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;box-shadow:var(--shadow-lg)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:20px;color:var(--fg-3);font-size:11px;font-weight:600;transition:color .2s,background .25s}
.nav button[aria-current=page]{color:var(--brand);background:color-mix(in srgb,var(--brand) 13%,transparent)}
.nav button[aria-current=page] .ic{animation:pop .35s}
.fab{position:absolute;inset-inline-start:22px;bottom:98px;z-index:4;width:58px;height:58px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--brand) 45%,transparent);transition:transform .2s}
.fab:active{transform:scale(.92) rotate(90deg)}

/* rings & bars */
.ringwrap{position:relative;display:grid;place-items:center;flex:none}
.ringwrap>svg{transform:rotate(-90deg)}
[dir=rtl] .ringwrap>svg{transform:rotate(-90deg) scaleY(-1)}
.ringwrap .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--bc,var(--brand)) 16%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--bc,var(--brand))}

/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.li:last-child{border-bottom:0}
.emobox{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc,var(--brand)) 13%,var(--surface-2))}

/* sheet, scrim, toast, banner */
.scrim{position:absolute;inset:0;background:rgba(5,12,20,.5);z-index:20;display:flex;align-items:flex-end;animation:fade .25s both}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:30px 30px 0 0;padding:8px 18px 26px;display:flex;flex-direction:column;gap:14px;animation:sheetUp .38s cubic-bezier(.2,.8,.2,1) both;scrollbar-width:none}
.sheet.still{animation:none}
.sheet>*{flex-shrink:0}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 2px;flex:none}
.toast{position:absolute;inset-inline:18px;bottom:104px;z-index:30;background:var(--fg);color:var(--bg);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;animation:rise .35s both;box-shadow:var(--shadow-lg)}
.banner{position:absolute;top:10px;inset-inline:10px;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg);animation:bannerIn .45s cubic-bezier(.2,.8,.2,1) both}
.offline{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12.5px;font-weight:600;padding:6px 12px;background:color-mix(in srgb,var(--part) 18%,var(--surface));color:var(--fg)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}

/* onboarding */
.prog{padding:16px 20px 4px}
.prog .between{font-size:13px;font-weight:600;color:var(--fg-2)}
.prog .track{height:6px;border-radius:9px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.prog .track i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--signal));border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.qhead{padding:10px 2px 4px}
.qhead h1{margin:0 0 4px;font-size:27px;line-height:1.3;font-weight:700}
.qhead p{margin:0;color:var(--fg-2)}
.adapt{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--signal);background:var(--signal-soft);border-radius:999px;padding:4px 10px;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:14px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);transition:border-color .2s,background .2s,transform .15s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed=true]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.opt .t{font-weight:700;font-size:16px}
.opt .d{color:var(--fg-3);font-size:13px;line-height:1.45}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--fg-3);flex:none;display:grid;place-items:center;transition:all .2s}
.opt[aria-pressed=true] .radio{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.radio .ic{width:14px;height:14px;opacity:0}
.opt[aria-pressed=true] .radio .ic{opacity:1;animation:pop .3s}
.sexcard{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 8px;border-radius:24px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:16px;transition:all .2s}
.sexcard[aria-pressed=true]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.sexcard[aria-pressed=true] .emo{animation:pop .4s}
.wheel{height:220px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:88px}
.wheel .it{height:44px;display:grid;place-items:center;scroll-snap-align:center;font-family:var(--font-num);font-size:20px;color:var(--fg-3);transition:color .15s,font-size .15s,font-weight .15s}
.wheel .it.sel{color:var(--brand);font-size:27px;font-weight:700}
.wheelbox{position:relative;flex:1}
.wheelbox::before{content:"";position:absolute;inset-inline:6px;top:88px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);z-index:-1}
.wlabel{text-align:center;font-weight:700;color:var(--fg-2);font-size:13px}
.tgl{width:52px;height:30px;border-radius:99px;background:var(--surface-3);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .25s cubic-bezier(.2,.8,.2,1)}
.tgl[aria-checked=true]{background:var(--brand)}
.tgl[aria-checked=true]::after{inset-inline-start:25px}
.allg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:13.5px;position:relative;transition:all .2s}
.allg[data-sev=AVOID]{border-color:var(--part);background:color-mix(in srgb,var(--part) 10%,var(--surface))}
.allg[data-sev=SEVERE]{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.allg .tag{position:absolute;top:-9px;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 8px;color:#fff}
.tip{display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:12px 14px;background:var(--signal-soft);color:var(--fg);font-size:13.5px;border:1px solid color-mix(in srgb,var(--signal) 30%,transparent)}
.tip .emo{margin-top:1px}
details.explain{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:0 14px}
details.explain summary{list-style:none;cursor:pointer;padding:13px 0;display:flex;align-items:center;gap:8px;font-weight:700}
details.explain summary::-webkit-details-marker{display:none}
details.explain[open] summary .chev{transform:rotate(90deg)}
.chev{transition:transform .2s}
.timeline-day{position:relative;height:74px;border-radius:16px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}

/* meals */
.tl{display:flex;flex-direction:column;gap:12px;position:relative}
.tl::before{content:"";position:absolute;top:10px;bottom:10px;inset-inline-start:23px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 11px)}
.tlrow{display:flex;gap:10px;align-items:stretch}
.tltime{width:48px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;z-index:1}
.tldot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.tldot.done{background:var(--ok);border-color:var(--ok)}
.tldot.now{border-color:var(--kcal);--pc:var(--kcal);animation:pulse 1.6s infinite}
.tldot.late{border-color:var(--warn)}
.meal{flex:1;min-width:0;display:flex;gap:12px;align-items:center;padding:12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:start}
.meal .mm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.meal .nm{font-weight:700;font-size:15px;line-height:1.35}
.meal .meta{display:flex;gap:6px;align-items:center;color:var(--fg-3);font-size:12.5px;flex-wrap:wrap}
.eat{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;border:1.5px dashed color-mix(in srgb,var(--brand) 60%,var(--line));color:var(--brand);background:transparent;transition:all .25s}
.eat.done{border:0;background:var(--brand);color:var(--on-brand)}
.eat.done .ic{animation:pop .35s}
.thumb{border-radius:20px;display:grid;place-items:center;flex:none}

/* water */
.bottle{position:relative;width:150px;height:200px;margin:0 auto}
.bottle svg{position:absolute;inset:0}
.dropfx{position:absolute;left:50%;top:0;width:26px;height:26px;animation:drop .9s ease-in both;z-index:2}
.sess{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.sess::-webkit-scrollbar{display:none}
.ses{flex:none;width:66px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.ses.done{background:color-mix(in srgb,var(--water) 14%,var(--surface));border-color:color-mix(in srgb,var(--water) 40%,var(--line))}
.ses.now{border:2px solid var(--water);--pc:var(--water);animation:pulse 1.8s infinite}
.ses.miss{opacity:.55}
.qa{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px}

/* progress */
svg.chart{width:100%;height:auto;display:block;direction:ltr;overflow:visible}
svg.chart text{fill:var(--fg-3);font-size:10.5px;font-family:var(--font-num)}
.badgecell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 6px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.badgecell.lock .emo{filter:grayscale(1) opacity(.35)}
.badgecell.got{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--fat) 22%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--fat) 45%,var(--line))}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:11.5px;font-family:var(--font-num);font-weight:600}

/* shopping */
.shop{display:flex;align-items:center;gap:12px;padding:10px 2px;width:100%;text-align:start;border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:0}
.cbx{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s;color:transparent}
.shop[aria-checked=true] .cbx{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.shop[aria-checked=true] .sn{text-decoration:line-through;color:var(--fg-3)}

/* plan generation */
.gen{position:absolute;inset:0;z-index:25;background:radial-gradient(120% 80% at 50% 0%,#12324A 0%,#0A1622 55%,#060D16 100%);color:#EAF4F8;display:flex;flex-direction:column;overflow:hidden}
.gen .stp{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#8FA6B8;transition:color .3s}
.gen .stp .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #2A4458;font-size:12px;font-weight:700;flex:none;transition:all .3s}
.gen .stp.on{color:#fff}.gen .stp.on .n{border-color:#38BDF8;color:#38BDF8;--pc:#38BDF8;animation:pulse 1.4s infinite}
.gen .stp.ok{color:#9BE7C8}.gen .stp.ok .n{background:#2BD49A;border-color:#2BD49A;color:#04241A}
.gtile{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.06);display:grid;place-items:center;transition:all .45s cubic-bezier(.2,.8,.2,1);position:relative}
.gtile.out{opacity:.12;transform:scale(.7) rotate(-8deg);filter:grayscale(1)}
.gtile .why{position:absolute;bottom:-2px;font-size:9px;background:#F87171;color:#fff;border-radius:6px;padding:0 4px;white-space:nowrap;opacity:0;transition:opacity .3s}
.gtile.out .why{opacity:1}
.slot{flex:1;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;font-size:11.5px;color:#9FB3C4;transition:all .3s}
.slot.lock{border-color:#2BD49A;background:rgba(43,212,154,.12);color:#DFF7EE}
.slot .reel{height:40px;display:grid;place-items:center}
.cm{display:flex;align-items:center;gap:10px;font-size:12.5px}
.cm .bar{flex:1;height:7px;background:rgba(255,255,255,.08)}
.cm .bar i{transition:width .5s cubic-bezier(.3,.7,.2,1),background .3s;background:#38BDF8}
.cm.ok .bar i{background:#2BD49A}
.cm .ck{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:transparent;transition:all .3s}
.cm.ok .ck{background:#2BD49A;color:#04241A}
.dayc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#8FA6B8}
.dayc .o{width:34px;height:34px;border-radius:50%;border:2px dashed #2A4458;display:grid;place-items:center;transition:all .3s}
.dayc.run .o{border-style:solid;border-color:#38BDF8;border-top-color:transparent;animation:spin .8s linear infinite}
.dayc.ok .o{border:0;background:#2BD49A;color:#04241A;animation:pop .35s}
.dayc.ok{color:#DFF7EE}

/* welcome */
.orbit{position:relative;width:260px;height:260px;margin:0 auto}
.orbit .plate{position:absolute;inset:60px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#E9F3EF 60%,#D4E6DF);box-shadow:0 18px 40px rgba(0,0,0,.25),inset 0 -6px 14px rgba(0,0,0,.06);display:grid;place-items:center}
.orbit .ringo{position:absolute;inset:0;animation:orbit 26s linear infinite}
.orbit .ringo>span{position:absolute;width:52px;height:52px;margin:-26px;display:grid;place-items:center;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.orbit .ringo>span>svg{animation:counter 26s linear infinite}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.35);transition:all .3s}
.dots i.on{width:22px;background:#fff}

/* panel */
.panel{width:290px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--fg);box-shadow:var(--shadow)}
.panel h2{margin:0;font-size:16px}
.panel p{margin:0;font-size:12.5px;color:var(--fg-3)}
.panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.panel button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 6px;font-size:12.5px;min-height:38px;text-align:center}
.panel button[aria-pressed=true]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:700}
.panel .lbl{font-size:12px;color:var(--fg-3);font-weight:700;margin-top:4px}
</style>
<div class="stage"><div id="app" class="app" dir="rtl"></div><aside id="panel" class="panel" dir="rtl" aria-label="Prototype controls"></aside></div>

const PAL={SEDENTARY:1.2,LIGHT:1.375,MODERATE:1.55,HIGH:1.725,ATHLETE:1.9};
function targets(){
 const o=S.o,bmr=10*o.w+6.25*o.h-5*o.age+(o.sex==='MALE'?5:-161),tdee=bmr*PAL[o.act];
 let adj=0;const up=o.goal==='GAIN'||o.goal==='MUSCLE';
 // MUSCLE = a small fixed surplus (0.25 kg a week, about 275 kcal), inside the existing gain cap of 500 kcal
 if(o.goal!=='MAINTAIN'){const rate=o.goal==='MUSCLE'?0.25:o.goal==='GAIN'?Math.min(o.rate,0.5):Math.min(o.rate,o.w*0.01);adj=Math.min(up?500:1000,rate*7700/7);}
 const floor=o.sex==='MALE'?1500:1200;const kcal=Math.max(floor,Math.round((o.goal==='LOSE'?tdee-adj:up?tdee+adj:tdee)/10)*10);
 const bmi=o.w/((o.h/100)**2),ibw=25*(o.h/100)**2,refw=bmi<30?o.w:ibw+0.4*(o.w-ibw);
 let gpk={LOSE:1.4,MAINTAIN:1.0,GAIN:1.8,MUSCLE:1.8}[o.goal];if(o.act==='ATHLETE')gpk=Math.max(gpk,1.8);
 if(o.prot==='SPORT')gpk=Math.max(gpk,1.8);if(o.prot==='HIGH')gpk=o.goal==='MUSCLE'?2.2:2.0;
 const protein=Math.round(refw*gpk),fat=Math.round(kcal*0.3/9),carb=Math.round((kcal-protein*4-fat*9)/4),fiber=Math.round(kcal/1000*14);
 const heart=o.care.includes('HEART_DISEASE');
 const water=heart?(o.hasDoc?o.docGoal:null):(o.sex==='MALE'?2000:1600);
 // MUSCLE: protein is a floor (target) with a ceiling of 2.2 g/kg, and each main meal needs at least 25 g
 return {bmr:Math.round(bmr),tdee:Math.round(tdee),adj:Math.round(adj),kcal,protein,fat,carb,fiber,water,bmi,gpk,refw:Math.round(refw),pmax:o.goal==='MUSCLE'?Math.round(refw*2.2):null,pmeal:o.goal==='MUSCLE'?25:null};
}

function windows(d=2){const w=baseWindows(),tr=training(d);if(tr&&tr.sw)w.SNACK=tr.sw;return w}
function sessions(){
 const t=targets(),goal=t.water||2000,W=S.o.wake+30,Z=(S.o.sleep<=S.o.wake?S.o.sleep+1440:S.o.sleep)-60;
 const n=Math.max(4,Math.round((Z-W)/120)+1),step=(Z-W)/(n-1),amt=Math.round(goal/n/50)*50;

}

 await sleep(150);if(!ok())return;const r=$('gring');if(r)r.style.strokeDashoffset=465*0.12;countTo($('gk'),t.kcal,1300);
 const chips=[`BMR ${fmt(t.bmr)}`,`× ${PAL[S.o.act]}`,`TDEE ${fmt(t.tdee)}`,S.o.goal==='MAINTAIN'?'':`${S.o.goal==='LOSE'?'−':'+'} ${fmt(t.adj)}`].filter(Boolean);
 for(const c of chips){await sleep(320);if(!ok())return;const f=$('gform');if(f)f.insertAdjacentHTML('beforeend',`<span class="chip num" style="background:rgba(255,255,255,.08);color:#DCEBF5;animation:pop .35s">${c}</span>`)}
 await sleep(500);if(!ok())return;
 // 2. filter
 step(1);stage(`<div class="between"><div><div class="num" style="font-size:40px;font-weight:700;line-height:1" id="gcnt">186</div><div style="font-size:12.5px;color:#8FA6B8">${L('وجبة في المطبخ','meals in the kitchen')}</div></div><div class="col" style="gap:6px;align-items:flex-end" id="gflt"></div></div>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">${GENTILES.map((e,i)=>`<div class="gtile" id="gt${i}">${E(e,30)}${GENOUT[i]?`<span class="why">${muscle()&&['salt','sesame'].includes(GENOUT[i][0])?L('بروتين قليل','low protein'):L(GENOUT[i][1],{sesame:'sesame',salt:'high salt',nope:'disliked',fat:'sat. fat'}[GENOUT[i][0]])}</span>`:''}</div>`).join('')}</div>`);
 const fl=muscle()?[['flexed-biceps',L('الأغنى بالبروتين أولًا','Protein-rich first')],['high-voltage',L('وجبة حول التمرين','Meals around training')],['thumbs-down',L('بدون ما لا تحبه','No disliked meals')]]:[['shield',L('تجنب السمسم','Avoid sesame')],['herb',L('ملح أقل','Less salt')],['thumbs-down',L('بدون ما لا تحبه','No disliked meals')]];
 const outs=Object.keys(GENOUT);countTo($('gcnt'),112,1700,186);

 await sleep(500);if(!ok())return;

async function solveDay(d,tok,speed){
 const ok=()=>tok===genTok&&S.gen,$=id=>document.getElementById(id);
 const dc=$('gd'+d);if(dc)dc.className='dayc run';const lbl=$('gdaylbl');if(lbl)lbl.textContent=L(`اليوم ${d+1} من 7 · ${DAYS[d][0]}`,`Day ${d+1} of 7 · ${DAYS[d][1]}`);
 for(let i=0;i<5;i++){const m=$('gm'+i);if(m){m.classList.remove('ok');m.querySelector('i').style.width='10%'}}
 for(let i=0;i<4;i++){const s=$('gs'+i);if(s)s.classList.remove('lock')}
 const pool=GENTILES.filter((_,i)=>!GENOUT[i]);let tick=0,locked=0,combos=0;
 const final=WEEK[d].m.map(m=>MEALS[m].e);
 while(locked<4){
  await sleep(85);if(!ok())return;tick++;combos+=Math.round(40+Math.random()*90);
  for(let i=locked;i<4;i++){const r=$('gr'+i);if(r)r.innerHTML=E(pool[(tick*3+i*5)%pool.length],36)}
  const lg=$('glog');if(lg)lg.textContent=`CP-SAT · ${fmt(combos)} ${L('تركيبة جُربت','combinations tried')}`;
  for(let i=0;i<5;i++){const m=$('gm'+i);if(m&&!m.classList.contains('ok'))m.querySelector('i').style.width=(20+Math.random()*60)+'%'}
  if(tick%Math.max(2,Math.round(9*speed))===0){const r=$('gr'+locked);if(r)r.innerHTML=`<span style="animation:pop .3s;display:inline-block">${E(final[locked],36)}</span>`;const s=$('gs'+locked);if(s)s.classList.add('lock');
   const m=$('gm'+[0,1,3,2][locked]);if(m){m.classList.add('ok');m.querySelector('i').style.width='100%'}locked++}
 }
 const m4=$('gm4');if(m4){m4.classList.add('ok');m4.querySelector('i').style.width='100%'}
 const time=(1.4+((d*7)%5)*0.6).toFixed(1),cand=104+((d*13)%11);
 const lg=$('glog');if(lg)lg.innerHTML=`<span style="color:#2BD49A">● ${L('أمثل','OPTIMAL')}</span> · ${time} ${L('ث','s')} · ${cand} ${L('وجبة مرشحة','candidate meals')}`;
 if(dc){dc.className='dayc ok';dc.querySelector('.o').innerHTML=I('check','',3)}
 await sleep(speed>=1?900:380);
}

 confetti(0.5,0.35,140);
}
function countTo(el,to,ms,from=0){if(!el)return;const t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function confetti(cx,cy,n=60){
 const fx=document.getElementById('fx');if(!fx||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=document.createElement('canvas'),r=fx.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;c.style.cssText='width:100%;height:100%';fx.appendChild(c);
 const x=c.getContext('2d'),cols=['#2BD49A','#38BDF8','#FF9147','#FFC23D','#FF6B81','#5C9BFF'];
 const ps=Array.from({length:n},()=>({x:cx*c.width,y:cy*c.height,vx:(Math.random()-.5)*26,vy:-Math.random()*26-6,s:6+Math.random()*10,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
 let f=0;const loop=()=>{x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.9;p.vx*=.985;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<110)requestAnimationFrame(loop);else c.remove()};loop();
}

/* ---------- render ---------- */
const app=document.getElementById('app'),panelEl=document.getElementById('panel');
const SCREENS={welcome,login,onboarding,home,plan,shop,water,progress,profile};
function render(){
 app.className='app'+(S.mode!=='auto'?' mode-'+S.mode:'');applyAccent();app.dir=rtl()?'rtl':'ltr';document.documentElement.lang=S.lang;panelEl.dir=app.dir;
 const sc=app.querySelector('.scroll'),keep=!S.anim&&sc?sc.scrollTop:0;
 let h=SCREENS[S.screen]();
 if(S.sheet){h+=({meal:mealSheet,swap:swapSheet,quick:quickSheet,weight:weightSheet,water:waterSheet,badge:badgeSheet,fav:favSheet})[S.sheet.type](S.sheet)}
 if(S.toast)h+=`<div class="toast" role="status">${E(S.toast.e||'check-mark-button',24)}<span>${S.toast.t}</span></div>`;
 if(S.banner)h+=`<div class="banner" role="alert">${E(S.banner.e,38)}<div class="grow"><div class="row" style="gap:6px;font-size:12px;color:var(--fg-3)">${E('seedling',14)}NutriGuide · ${L('الآن','now')}</div><b>${S.banner.t}</b><div class="faint">${S.banner.b}</div></div></div>`;
 if(S.gen)h+=genSkeleton();
 app.innerHTML=h+'<div id="fx"></div>';
 const ns=app.querySelector('.scroll');if(ns&&keep)ns.scrollTop=keep;
 if(S.sheet)S.sheet.still=true;
 initWheels();runCounters();S.anim=false;renderPanel();
}
function runCounters(){app.querySelectorAll('.cu').forEach(el=>{const to=+el.dataset.to,d=+el.dataset.d;if(el.textContent!==fmt(to,d)){const t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/1100),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e,d);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}})}
function initWheels(){
 app.querySelectorAll('.wheel').forEach(wh=>{
  const key=wh.dataset.wheel,min=+wh.dataset.min,step=+wh.dataset.step,get=()=>key==='wlog'?(S.wlog??WEIGHTS[WEIGHTS.length-1]):S.o[key];
  const items=[...wh.querySelectorAll('.it')],idx0=Math.round((get()-min)/step);
  wh.scrollTop=idx0*44;items.forEach((it,i)=>it.classList.toggle('sel',i===idx0));
  let raf=0;wh.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
   const i=Math.max(0,Math.min(items.length-1,Math.round(wh.scrollTop/44))),v=+(min+i*step).toFixed(2);
   items.forEach((it,j)=>it.classList.toggle('sel',j===i));
   if(key==='wlog')S.wlog=v;else S.o[key]=v;
   if(key==='h'||key==='w'){const c=document.getElementById('bmicard');if(c)c.innerHTML=bmiCard()}
   if(key==='tw'){const p=document.getElementById('paceinfo');if(p)p.innerHTML=paceInfo()}
  })});
  items.forEach((it,i)=>it.addEventListener('click',()=>wh.scrollTo({top:i*44,behavior:'smooth'})));
 });
}
let toastT,bannerT;
function toast(t,e){S.toast={t,e};render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},2300)}
function banner(e,t,b){S.banner={e,t,b};render();clearTimeout(bannerT);bannerT=setTimeout(()=>{S.banner=null;render()},4800)}
function go(scr,back){S.screen=scr;S.nav=back?'back':'fwd';S.anim=true;S.sheet=null;render();}

/* ---------- events ---------- */
app.addEventListener('click',ev=>{
 const g=ev.target.closest('[data-go]');if(g&&!ev.target.closest('[data-act]:not([data-go])')){go(g.dataset.go,!!g.dataset.back);return}
 const a=ev.target.closest('[data-act]');if(!a)return;
 if(a.dataset.act==='close'&&ev.target!==a)return; // clicks inside the sheet do not close it
 act(a.dataset.act,a,ev);
});
app.addEventListener('input',ev=>{
 const k=ev.target.dataset.in;if(k==='name'){S.o.name=ev.target.value;const b=app.querySelector('[data-act=onbNext]');if(b)b.disabled=!S.o.name.trim()}
 if(k==='wrange'){const v=+ev.target.value;S.sheet.v=v;['wv','wv2'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=fmt(v)});
  const w=document.getElementById('wwarn');if(w)w.innerHTML=v>500?tip('light-bulb',L('كمية كبيرة لجلسة واحدة. الأفضل توزيعها على جلستين، فالجسم يستفيد من الماء أكثر عندما يُشرب على دفعات.','That’s a lot in one sitting. Splitting it in two helps your body use the water better.')):'';
  const btn=app.querySelector('.sheet [data-act=addw]');if(btn)btn.dataset.v=v}
});
function act(k,a,ev){
 const v=a.dataset.v,id=+a.dataset.id,o=S.o;
 switch(k){
 case 'lang':S.lang=v;save();S.anim=true;render();break;
 case 'mode':S.mode=v;save();render();break;
 case 'startOnb':S.step=0;go('onboarding');break;
 case 'onbNext':{const st=steps();if(S.step>=st.length-1){if(general()){go('home')}else{S.gen=true;render();runGen()}}else{S.step++;S.nav='fwd';S.anim=true;render();}break;}
 case 'onbBack':if(S.step===0)go('welcome',true);else{S.step--;S.nav='back';S.anim=true;render();}break;
 case 'sex':o.sex=v;render();break;
 case 'goal':o.goal=v;if(v==='MUSCLE'){o.prot='GOAL';o.tw=o.w+3}if(v==='LOSE'&&o.tw>=o.w)o.tw=o.w-8;if(v==='GAIN'&&o.tw<=o.w)o.tw=o.w+5;render();break;
 case 'rate':o.rate=+v;render();break;
 case 'act':o.act=v;if(v!=='HIGH'&&v!=='ATHLETE'&&o.goal!=='MUSCLE')o.prot='GOAL';render();break;
 case 'prot':o.prot=v;render();break;
 case 'tdays':o.tdays=+v;render();break;
 case 'ttime':{const [lo,hi]=ttRange();o.ttime=Math.max(lo,Math.min(hi,o.ttime+ +v));render();break;}
 case 'accent':o.accent=v;render();break;
 case 'avatar':o.avatar=v;render();break;
 case 'editTrain':S.step=steps().indexOf('training');go('onboarding');break;
 case 'care':if(v==='NONE')o.care=[];else o.care=o.care.includes(v)?o.care.filter(x=>x!==v):[...o.care,v];if(!o.care.includes('DIABETES_T2'))o.insulin=false;render();break;
 case 'alg':{const c=o.allergy[v];if(!c)o.allergy[v]='AVOID';else if(c==='AVOID')o.allergy[v]='SEVERE';else delete o.allergy[v];render();break;}
 case 'safe':o[v]=!o[v];render();break;
 case 'time':{const key=a.dataset.k;o[key]=(o[key]+ +v+1440)%1440;render();break;}
 case 'hasDoc':o.hasDoc=!o.hasDoc;render();break;
 case 'doc':o.docGoal=Math.max(500,Math.min(3000,o.docGoal+ +v));render();break;
 case 'genSkip':genTok++;S.gen=false;go('home');toast(L('خطتك جاهزة','Your plan is ready'),'party-popper');break;
 case 'genDone':S.gen=false;go('home');break;
 case 'kmode':S.kmode=v;S.anim=false;render();break;
 case 'eat':{const was=!!S.eaten[id];S.eaten[id]=!was;if(a.dataset.close)S.sheet=null;
  if(!was){const it=TODAY.find(i=>i.id===id);const r=a.getBoundingClientRect(),ar=app.getBoundingClientRect();render();confetti((r.left+r.width/2-ar.left)/ar.width,(r.top-ar.top)/ar.height,36);
   if(TODAY.every(i=>S.eaten[i.id])){setTimeout(()=>confetti(.5,.3,150),200);toast(L(G('يوم مكتمل! حققت خطة اليوم كاملة','يوم مكتمل! حققتِ خطة اليوم كاملة'),'Day complete! You followed today’s plan'),'trophy')}else toast(L(`${G('أحسنتَ','أحسنتِ')}! سجلنا ${sl(it.slot)}`,`Nice! ${sl(it.slot)} logged`),'check-mark-button')}else render();break;}
 case 'meal':S.sheet={type:'meal',id};render();break;
 case 'mealx':S.sheet={type:'meal',m:a.dataset.m};render();break;
 case 'mult':S.mult[id]=+v;render();break;
 case 'swap':S.sheet={type:'swap',id};render();break;
 case 'doswap':{const it=TODAY.find(i=>i.id===id);it.m=a.dataset.m;S.sheet=null;toast(L('تم الاستبدال، وبقي يومك ضمن حدودك','Swapped. Your day stays within limits'),'sparkles');break;}
 case 'fav':S.favs[a.dataset.m]=!S.favs[a.dataset.m];if(S.favs[a.dataset.m])toast(L(G('أضيفت لمفضلاتك، سنقترحها أكثر','أضيفت لمفضلاتكِ، سنقترحها أكثر'),'Added to favourites, we’ll suggest it more'),'red-heart');else render();break;
 case 'nope':S.nope[a.dataset.m]=!S.nope[a.dataset.m];if(S.nope[a.dataset.m])toast(L('لن نقترحها في خططك القادمة','We won’t suggest it in future plans'),'thumbs-down');else render();break;
 case 'close':S.sheet=null;render();break;
 case 'quick':S.sheet={type:'quick'};render();break;
 case 'quickgo':S.sheet=null;if(v==='water')go('water');else if(v==='shop')go('shop');else if(v==='weight'){S.sheet={type:'weight'};render()}else toast(L('في التطبيق: ابحث عن أي طعام وسجله','In the app: search any food and log it'),'magnifying-glass-tilted-left');break;
 case 'weight':S.sheet={type:'weight'};render();break;
 case 'saveWeight':S.sheet=null;toast(L(`سجلنا وزنك ${fmt(S.wlog??88.4,1)} كغ`,`Saved ${fmt(S.wlog??88.4,1)} kg`),'balance-scale');break;
 case 'addw':{if(ev)ev.stopPropagation();const ml=+a.dataset.v;S.water.push({t:hm(S.now),ml});if(a.dataset.close)S.sheet=null;render();
  const b=document.getElementById('bottle');if(b){b.insertAdjacentHTML('beforeend',`<span class="dropfx">${E('droplet',26)}</span>`)}
  const t=targets(),tot=S.water.reduce((x,y)=>x+y.ml,0);
  if(t.water&&tot>=t.water&&tot-ml<t.water){confetti(.5,.3,90);toast(L(G('وصلت هدف الماء اليوم!','وصلتِ هدف الماء اليوم!'),'You reached today’s water goal!'),'trophy')}else toast(L(`أضفنا ${fmt(ml)} مل`,`Added ${fmt(ml)} ml`),'droplet');break;}
 case 'wcustom':S.sheet={type:'water',v:250};render();break;
 case 'wset':S.sheet.v=+v;S.sheet.still=true;render();break;
 case 'delw':S.water.splice(+v,1);render();break;
 case 'pday':if(S.screen==='plan'){S.planDay=+v;render()}else{S.planDay=+v;go('plan')}break;
 case 'regen':S.gen=true;render();runGen();break;
 case 'shopck':S.shop[v]=!S.shop[v];render();break;
 case 'share':toast(L('في التطبيق: تُشارك القائمة كنص عبر أي تطبيق','In the app: the list is shared as text to any app'),'share');break;
 case 'favlist':S.sheet={type:'fav'};render();break;
 case 'ptab':S.progTab=v;S.anim=true;render();break;
 case 'badge':S.sheet={type:'badge',b:v};render();break;
 case 'rem':S.rem[v]=!S.rem[v];render();break;
 case 'editOnb':S.step=1;go('onboarding');break;
 case 'editRhythm':S.step=steps().indexOf('rhythm');go('onboarding');break;
 case 'streak':toast(L(G('5 أيام متتالية من الالتزام. استمر!','5 أيام متتالية من الالتزام. استمري!'),'5 days in a row. Keep going!'),'fire');break;
 case 'notify':notifyMeal();break;
 }
}
function notifyMeal(){const it=TODAY.find(i=>mealState(i)==='now')||TODAY[1];banner(SLOT[it.slot][0],L(`حان وقت ${sl(it.slot)} · ${mname(it.m)}`,`${sl(it.slot)} time · ${mname(it.m)}`),L(`موعدك حتى ${hm(windows()[it.slot][1])}. اضغط «أكلتها» بعد الأكل.`,`Your window is open until ${hm(windows()[it.slot][1])}. Tap “I ate it” after.`))}

/* ---------- prototype panel (not part of the app) ---------- */
function renderPanel(){
 const b=(act,v,l,on)=>`<button data-pact="${act}" data-v="${v}" aria-pressed="${!!on}">${l}</button>`;
 const sc=[['welcome',L('الترحيب','Welcome')],['login',L('الدخول','Sign in')],['onboarding',L('الإعداد المتكيف','Adaptive setup')],['result',L('نتيجة الإعداد','Setup result')],['gen',L('بناء الخطة','Plan building')],['home',L('اليوم','Today')],['meal',L('تفاصيل وجبة','Meal detail')],['plan',L('الخطة','Plan')],['shop',L('المشتريات','Shopping')],['water',L('الماء','Water')],['progress',L('التقدم','Progress')],['profile',L('حسابي','Me')]];
 const cur=S.gen?'gen':S.sheet&&S.sheet.type==='meal'?'meal':S.screen==='onboarding'&&steps()[S.step]==='result'?'result':S.screen;
 panelEl.innerHTML=`<h2>${L('لوحة التجربة','Demo controls')}</h2><p>${L('أداة لعرض النموذج فقط، وليست جزءًا من التطبيق.','For the demo only, not part of the app.')}</p>
 <div class="lbl">${L('جرّب شخصية','Try a persona')}</div><div class="grid">${Object.entries(PERSONAS).map(([k,p])=>b('persona',k,L(p.ar,p.en),S.persona===k)).join('')}</div>
 <p style="margin-top:6px">${L('اللون يتبع الهدف، والمخاطبة والرسمة تتبع الجنس. قارن يوسف بريم.','Colour follows the goal; address and avatar follow sex. Compare Yusuf and Reem.')}</p>
 <div class="lbl">${L('الشاشات','Screens')}</div><div class="grid">${sc.map(([k,l])=>b('scr',k,l,cur===k)).join('')}</div>
 <div class="lbl">${L('سيناريوهات','Scenarios')}</div><div class="grid">
 ${b('notify','',L('إشعار موعد وجبة','Meal reminder'),0)}${b('scen','late',L('فات موعد وجبة','Missed a meal'),S.scen.late)}
 ${b('scen','complete',L('يوم مكتمل','Day complete'),S.scen.complete)}${b('scen','offline',L('دون إنترنت','Offline'),S.scen.offline)}
 ${b('scen','general',L('الوضع العام','General mode'),S.scen.general)}${b('scen','fluid',L('ماء بهدف الطبيب','Doctor water goal'),S.o.care.includes('HEART_DISEASE'))}
 ${b('athlete','',L('سؤال البروتين (نشاط عالٍ)','Protein question (high activity)'),0)}${b('insulin','',L('سؤال الإنسولين (سكر الدم)','Insulin question (blood sugar)'),0)}</div>
 <div class="lbl">${L('اللغة والمظهر','Language and theme')}</div><div class="grid">${b('lang','ar','العربية',S.lang==='ar')}${b('lang','en','English',S.lang==='en')}</div>
 <div class="grid" style="grid-template-columns:1fr 1fr 1fr">${b('mode','light',L('فاتح','Light'),S.mode==='light')}${b('mode','dark',L('ليلي','Dark'),S.mode==='dark')}${b('mode','auto',L('تلقائي','Auto'),S.mode==='auto')}</div>
 <p>${L('الرسومات: Fluent Emoji من Microsoft (رخصة MIT). أسماء الوجبات من كتالوج المشروع، والأرقام للعرض.','Illustrations: Microsoft Fluent Emoji (MIT). Meal names from the project catalog; numbers are illustrative.')}</p>`;
}
panelEl.addEventListener('click',ev=>{
 const a=ev.target.closest('[data-pact]');if(!a)return;const k=a.dataset.pact,v=a.dataset.v;
 genTok++;S.gen=false;S.sheet=null;
 if(k==='scr'){if(v==='result'){S.step=steps().length-1;go('onboarding')}else if(v==='gen'){S.screen='home';S.gen=true;render();runGen()}else if(v==='meal'){go('home');S.sheet={type:'meal',id:2};render()}else go(v);}
 else if(k==='notify'){if(S.screen==='welcome'||S.screen==='onboarding'||S.screen==='login')go('home');notifyMeal()}
 else if(k==='scen'){if(v==='fluid'){S.o.care=S.o.care.includes('HEART_DISEASE')?S.o.care.filter(x=>x!=='HEART_DISEASE'):[...S.o.care,'HEART_DISEASE'];go('water')}
  else{S.scen[v]=!S.scen[v];if(v==='late'){S.eaten[1]=!S.scen.late}if(v==='complete'&&S.scen.complete){go('home');setTimeout(()=>confetti(.5,.3,150),300);return}go(['home','plan','water','progress','profile','shop'].includes(S.screen)?S.screen:'home')}}
 else if(k==='persona'){setPersona(v);S.planDay=2;go(['welcome','login','onboarding'].includes(S.screen)?'home':S.screen)}
 else if(k==='athlete'){S.o.act='ATHLETE';S.step=steps().indexOf('protein');go('onboarding')}
 else if(k==='insulin'){if(!S.o.care.includes('DIABETES_T2'))S.o.care=[...S.o.care,'DIABETES_T2'];S.step=steps().indexOf('safety');go('onboarding')}
 else if(k==='lang'){S.lang=v;save();S.anim=true;render()}
 else if(k==='mode'){S.mode=v;save();render()}
});
setInterval(()=>{if(S.screen==='welcome'&&!S.sheet){S.welcomeSlide++;const w=app.querySelector('.wslide');if(w){w.style.animation='none';void w.offsetWidth;}render();const n=app.querySelector('.wslide');if(n)n.style.animation='rise .5s both'}},4200);
setPersona(S.persona||'ahmed');render();
</script>
