default_lang: ar
note: Preparation steps per meal; loaded only after the meal_steps migration .
meals:
- ref_external: NG-D19
  dish_form: ONE_DISH
  steps_ar:
  - اخلط التن المصفّى مع البصل والبقدونس المفرومين والفلفل الحار والملح.
  - ضع ورقة بريك في صينية مدهونة، وضع في وسطها ملعقة من الحشوة، واكسر فوقها نصف بيضة مخفوقة.
  - اطوِ الورقة مثلثًا أو مستطيلًا، وادهن وجهها بزيت الزيتون.
  - اخبزها على 200 درجة حتى تتحمّر وتصير مقرمشة (حوالي 15 دقيقة). الحصة قطعتان.
- ref_external: NG-D20
  dish_form: ONE_DISH
  steps_ar:
  - اغسل الخضار جيدًا، وقطّع الخس قطعًا والطماطم والخيار والبصل مكعبات صغيرة.
  - افرم البقدونس، واخلط الكل في وعاء.
  - تبّلها بزيت الزيتون وعصير الليمون والملح قبل التقديم مباشرة.
- ref_external: NG-D21
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الكبدة شرائح رفيعة، والبصل شرائح.
  - سخّن الزيت في مقلاة على نار عالية، وقلّب الكبدة مع البصل والثوم دقيقتين أو ثلاثًا فقط حتى لا تقسو.
  - أضف الكمون والفلفل الحار (الخبزة فيها ملح كافٍ، فلا يُضاف ملح).
  - افتح الخبزة واحشها بالكبدة وشرائح الطماطم، وتؤكل ساخنة.
- ref_external: NG-D22
  dish_form: ONE_DISH
  steps_ar:
  - قلّب اللحم المفروم مع البصل في 5 غ من الزيت حتى ينضج، ثم أضف البقدونس والقرفة والفلفل والملح، واتركه يبرد.
  - اخلط الحشوة مع البيضة المخفوقة.
  - ضع ملعقة من الحشوة على طرف ورقة البريك، ولفّها أصابع، وأغلق الطرفين.
  - رصّها في صينية، وادهنها بباقي الزيت، واخبزها على 200 درجة حتى تتحمّر (حوالي 20 دقيقة). الحصة إصبعان.
- ref_external: NG-D23
  dish_form: ONE_DISH
  steps_ar:
  - صفّ الفول واشطفه بالماء.
  - قطّع الطماطم والبصل مكعبات صغيرة، وافرم البقدونس، واهرس الثوم.
  - اخلط الكل مع عصير الليمون وزيت الزيتون والكمون ورشة الملح.
  - تُقدَّم باردة أو بدرجة حرارة الغرفة.
- ref_external: NG-D24
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الخبز مربعات صغيرة، وحمّصه في الفرن حتى يصير مقرمشًا (حوالي 8 دقائق).
  - قطّع الخس والطماطم والخيار والفجل والفلفل قطعًا متوسطة، وافرم البقدونس والبصل الأخضر.
  - اخلط زيت الزيتون وعصير الليمون والملح، ويُرشّ السماق حسب الرغبة (السماق غير محسوب في القيم).
  - اخلط الخضار مع الصلصة، وأضف الخبز المحمّص في آخر لحظة حتى يبقى مقرمشًا.
- ref_external: NG-D25
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الكوسا شرائح طولية، واشوها في الفرن أو على مقلاة مضلعة حتى تلين وتتحمّر (حوالي 20 دقيقة).
  - اهرس الكوسا بالشوكة، واتركها تصفّى من مائها 10 دقائق.
  - اخلطها مع الطحينة والزبادي والثوم المهروس وعصير الليمون والملح.
  - افردها في صحن، وصبّ زيت الزيتون على الوجه، وتُقدَّم مع الخبز.
- ref_external: NG-D26
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الطماطم والخيار والبصل مكعبات صغيرة جدًا، وافرم البقدونس.
  - تبّلها بزيت الزيتون وعصير الليمون والملح، ويُضاف النعناع حسب الرغبة (النعناع غير محسوب في القيم).
  - تُقدَّم باردة.
- ref_external: NG-D27
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الخضار مكعبات صغيرة.
  - حمّر الشعرية في الزيت حتى يصير لونها ذهبيًا، ثم ارفعها جانبًا.
  - قلّب البصل في القدر نفسه، ثم أضف باقي الخضار ومعجون الطماطم والماء والملح والفلفل.
  - اتركها تغلي على نار هادئة حتى تنضج الخضار (حوالي 25 دقيقة)، ثم أضف الشعرية 8 دقائق.
  - تُقدَّم ساخنة.
- ref_external: NG-D28
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الباذنجان والكوسا والفلفل والبصل قطعًا كبيرة، واخلطها مع نصف الزيت.
  - اشوها في الفرن على 220 درجة حتى تتحمّر وتلين (حوالي 25 دقيقة).
  - رتّبها في صحن، وفتّت الجبن فوقها.
  - تبّلها بباقي الزيت وعصير الليمون والأوريجانو والفلفل (الجبن مالح، فلا يُضاف ملح).
- ref_external: NG-D29
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الطماطم والخيار قطعًا كبيرة، والفلفل والبصل حلقات رفيعة.
  - رتّبها في صحن مع الزيتون.
  - ضع قطعة الجبن فوقها، وصبّ زيت الزيتون ورشّ الأوريجانو (لا يُضاف ملح).
- ref_external: NG-D30
  dish_form: ONE_DISH
  steps_ar:
  - اغسل البطاطا الحلوة وقطّعها أصابع أو أنصافًا بقشرها.
  - اخلطها مع زيت الزيتون والفلفل الأحمر والملح.
  - اخبزها على 210 درجات حتى تلين من الداخل وتتحمّر (حوالي 35 دقيقة).
- ref_external: NG-S15
  dish_form: ONE_DISH
  steps_ar:
  - اغلِ الماء مع القهوة العربية المطحونة والهيل حسب الرغبة (الهيل غير محسوب في القيم) 10 دقائق، ثم صفّها.
  - تُقدَّم في فناجين صغيرة دون سكر.
- ref_external: NG-S16
  dish_form: ONE_DISH
  steps_ar:
  - اخلط عصير الليمون مع الماء البارد والسكر حتى يذوب.
  - يُضاف النعناع حسب الرغبة (النعناع غير محسوب في القيم)، ويُقدَّم باردًا.
- ref_external: NG-S17
  dish_form: ONE_DISH
  steps_ar:
  - اخلط الزيت مع السكر الناعم حتى يذوب السكر تقريبًا.
  - أضف الدقيق تدريجيًا وافركه بيدك حتى تصير عجينة متماسكة لا تلتصق.
  - شكّلها كرات صغيرة (20 كرة)، واضغط عليها قليلًا، ورتّبها في صينية.
  - اخبزها على 160 درجة حتى تتماسك ويبقى لونها فاتحًا (حوالي 15 دقيقة). الحصة قطعتان.
- ref_external: NG-S18
  dish_form: ONE_DISH
  steps_ar:
  - انقع الحمص ليلة كاملة، ثم صفّه (ماء النقع لا يُحسب).
  - اسلقه في ماء جديد حتى ينضج ويلين (ساعة تقريبًا، أو 25 دقيقة في قدر الضغط).
  - يُقدَّم ساخنًا في أكواب مع قليل من ماء السلق، ويُرشّ عليه الكمون والفلفل الحار والملح وعصير الليمون.
- ref_external: NG-S19
  dish_form: PLATE
  steps_ar:
  - يُقدَّم الزيتون في صحن صغير مع رشة زيت زيتون، وبجانبه الخبز.
- ref_external: NG-S20
  dish_form: ONE_DISH
  steps_ar:
  - انقع الشاي الأخضر في ماء ساخن (ليس مغليًا) 3 دقائق.
  - يُضاف النعناع حسب الرغبة (النعناع غير محسوب في القيم)، ويُشرب دون سكر.
- ref_external: NG-S21
  dish_form: ONE_DISH
  steps_ar:
  - حضّر الشاي الأحمر الليبي بغليه على نار هادئة مع السكر، وصبّه من ارتفاع حتى تتكون الرغوة.
  - يُضاف النعناع حسب الرغبة (النعناع غير محسوب في القيم).
  - ضع اللوز في الكوب وصبّ الشاي فوقه.
- ref_external: NG-S22
  dish_form: ONE_DISH
  steps_ar:
  - قشّر البرتقال والموز، وقطّع الفواكه مكعبات صغيرة.
  - اخلطها مع حبات الرمان وعصير الليمون حتى لا يتغير لون التفاح، وتُقدَّم باردة دون سكر.
- ref_external: NG-S23
  dish_form: ONE_DISH
  steps_ar:
  - اسلق الأرز المغسول في الماء حتى يتشربه (10 دقائق).
  - أضف الحليب، واتركه على نار هادئة مع التحريك حتى يتكثف (حوالي 30 دقيقة).
  - أضف السكر وحرّك 5 دقائق، ثم صبّه في أكواب، ورشّ القرفة، ويُقدَّم باردًا.
- ref_external: NG-S24
  dish_form: ONE_DISH
  steps_ar:
  - اخلط الدقيق مع الخميرة والملح والسمسم، وأضف الزيت وافركه، ثم الماء الفاتر حتى تصير عجينة متماسكة.
  - يُضاف الشمر أو اليانسون حسب الرغبة (غير محسوب في القيم).
  - شكّل أصابع رفيعة، واجمع طرفي كل إصبع على شكل حلقة.
  - اخبزها على 180 درجة حتى تتحمّر وتصير مقرمشة (حوالي 25 دقيقة). الحصة حلقتان.
- ref_external: NG-S25
  dish_form: ONE_DISH
  steps_ar:
  - حفنة صغيرة تؤكل كما هي.
- ref_external: NG-S26
  dish_form: ONE_DISH
  steps_ar:
  - تُغسل وتؤكل طازجة.
- ref_external: NG-S27
  dish_form: ONE_DISH
  steps_ar:
  - تُغسل وتؤكل طازجة.
- ref_external: NG-S28
  dish_form: ONE_DISH
  steps_ar:
  - تُغسل وتؤكل طازجة.
- ref_external: NG-S29
  dish_form: ONE_DISH
  steps_ar:
  - تُغسل وتؤكل طازجة.
- ref_external: NG-S30
  dish_form: ONE_DISH
  steps_ar:
  - تُغسل وتؤكل طازجة.
- ref_external: NG-S31
  dish_form: ONE_DISH
  steps_ar:
  - حفنة صغيرة تؤكل كما هي، دون ملح.
- ref_external: NG-S32
  dish_form: ONE_DISH
  steps_ar:
  - تُغسل وتؤكل طازجة.
- ref_external: NG-S33
  dish_form: ONE_DISH
  steps_ar:
  - تُحمّص البذور في مقلاة جافة دقيقتين دون ملح، وتؤكل حفنة صغيرة.
