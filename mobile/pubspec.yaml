name: nutriguide
description: "NutriGuide Android app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  retrofit: ^4.10.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3: ^3.8.0
  uuid: ^4.6.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.2
  swagger_parser: ^1.45.0
  drift_dev: ^2.35.1
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/IBMPlexSansArabic-OFL.txt
    - assets/fonts/ReadexPro-OFL.txt
    - assets/emoji/
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro[HEXP,wght].ttf
