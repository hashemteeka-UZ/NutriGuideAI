name: mobile

on:
  push:
    paths:
      - "mobile/**"
      - "docs/api/openapi.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "docs/api/openapi.json"
      - ".github/workflows/mobile.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Regenerate the API client and contract test
        working-directory: mobile
        run: bash tool/regenerate_api.sh

      - name: Fail if generated files are stale
        run: git diff --exit-code -- mobile

      - name: Check formatting
        working-directory: mobile
        run: |
          mapfile -d '' files < <(find lib test -name '*.dart' -not -path 'lib/core/api/generated/*' -not -name '*.g.dart' -print0)
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
