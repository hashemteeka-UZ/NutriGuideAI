dataset_version: team_recipe_steps_v2
default_lang: ar
note: Preparation steps per meal; loaded only after the meal_steps migration (#161).
meals:
- ref_external: NG-B12
  dish_form: ONE_DISH
  steps_ar:
  - قطّع البصل والفلفل والطماطم قطعًا صغيرة، واهرس الثوم.
  - سخّن زيت الزيتون في مقلاة، وقلّب البصل والفلفل حتى يذبلا.
  - أضف الطماطم والثوم والكمون والفلفل الحار والملح، واتركها على نار هادئة حتى تتكثف الصلصة (حوالي 8 دقائق).
  - اعمل ثلاث حفر في الصلصة، واكسر في كل حفرة بيضة، وغطِّ المقلاة حتى ينضج البيض (5 دقائق).
  - قدّمها ساخنة في المقلاة نفسها، وتؤكل بغمس الخبز الأسمر فيها.
- ref_external: NG-B13
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: صحن فول وبجانبه بيضتان مسلوقتان وخبز.'
  - اسلق البيض في ماء يغلي 10 دقائق، ثم برّده وقشّره.
  - سخّن الفول المطبوخ مع قليل من مائه، واهرسه هرسًا خفيفًا.
  - أضف الثوم المهروس والكمون والملح وعصير الليمون، ثم صبّ زيت الزيتون على الوجه.
  - قدّم الفول في صحن، وبجانبه البيض مقطّعًا أنصافًا، والخبز للغمس.
- ref_external: NG-B14
  dish_form: ONE_DISH
  steps_ar:
  - اخفق البيض وبياض البيض مع الملح والفلفل الأسود في وعاء.
  - سخّن زيت الزيتون في مقلاة، وقلّب البصل المفروم دقيقتين، ثم أضف السبانخ المقطّعة حتى تذبل.
  - صبّ البيض المخفوق فوق السبانخ، وحرّكه بهدوء على نار هادئة حتى يتماسك (3 دقائق).
  - قدّمه ساخنًا مع شريحتي خبز أسمر محمّص.
- ref_external: NG-B15
  dish_form: ONE_DISH
  steps_ar:
  - ضع الجبن الأبيض الطري في وعاء.
  - قطّع الفراولة والموز قطعًا صغيرة، ووزّعها فوق الجبن.
  - اكسر الجوز ورشّه مع القرفة على الوجه، ويؤكل باردًا بالملعقة.
- ref_external: NG-B16
  dish_form: ONE_DISH
  steps_ar:
  - ضع الزبادي اليوناني في وعاء.
  - اكسر الجوز واللوز قطعًا صغيرة ووزّعها على الوجه.
  - صبّ العسل فوقها، ويؤكل باردًا بالملعقة.
- ref_external: NG-B17
  dish_form: ONE_DISH
  steps_ar:
  - اطحن الشوفان في الخلاط حتى يصير مثل الدقيق.
  - أضف الموز والبيض وبياض البيض والحليب والقرفة، واخلطها حتى يصير خليطًا ناعمًا.
  - ادهن مقلاة غير لاصقة بقليل من الزيت على نار متوسطة.
  - صبّ مغرفة صغيرة من الخليط لكل قرص، واقلبه عندما تظهر فقاعات على وجهه (دقيقتان لكل جهة).
  - تخرج حوالي 5 أقراص، وتُقدَّم ساخنة.
- ref_external: NG-B18
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: وعاء شوفان حلو، وبجانبه بيضتان مسلوقتان تؤكلان منفصلتين، ولا يُطبخ البيض مع الشوفان.'
  - اسلق البيض في ماء يغلي 10 دقائق، ثم قشّره.
  - اطبخ الشوفان مع الحليب على نار هادئة 4 إلى 5 دقائق مع التحريك حتى يتكثف.
  - صبّ الشوفان في وعاء، وضع فوقه شرائح الموز والقرفة.
  - قدّم البيض في صحن صغير بجانبه مع رشة ملح.
- ref_external: NG-B19
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: بيض مسلوق وتوست وخضار في صحن واحد.'
  - اسلق البيض في ماء يغلي 10 دقائق، ثم قشّره وقطّعه أنصافًا.
  - حمّص شريحتي الخبز الأسمر، وقطّع الطماطم والخيار شرائح.
  - رتّب كل شيء في صحن، ورشّ الملح والكمون على البيض.
- ref_external: NG-B20
  dish_form: PLATE
  steps_ar:
  - افرد اللبنة في صحن، واعمل في وسطها تجويفًا بظهر الملعقة.
  - صبّ زيت الزيتون في التجويف، ورشّ الزعتر والملح.
  - قطّع الخيار والطماطم وضعها بجانب اللبنة.
  - تؤكل بغمس الخبز في اللبنة مع الخضار.
- ref_external: NG-B21
  dish_form: PLATE
  steps_ar:
  - صفِّ التونة من الماء جيدًا وضعها في وعاء.
  - أضف عصير الليمون وزيت الزيتون والفلفل الأسود، وفتّتها بالشوكة.
  - افرد التونة على شريحتي الخبز الأسمر، أو قدّمها بجانبهما.
  - قدّم الخيار مقطّعًا شرائح بجانبها.
- ref_external: NG-B22
  dish_form: ONE_DISH
  steps_ar:
  - افتح رغيف الخبز الأسمر من جانبه.
  - فتّت الجبن الأبيض المالح، وقطّع الطماطم والخيار شرائح رفيعة، والخس قطعًا.
  - احشُ الرغيف بالجبن والخضار والزيتون، ورشّ الأوريجانو.
  - يؤكل باردًا، أو يُحمّص في المقلاة دقيقتين من كل جهة.
- ref_external: NG-L18
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الدجاج قطعًا متوسطة، وافرم البصل، واهرس الثوم.
  - حمّر البصل في زيت الزيتون، ثم أضف الدجاج وقلّبه حتى يتغير لونه.
  - أضف الثوم ومعجون الطماطم والطماطم المعلبة والبهارات والملح، وقلّب دقيقتين.
  - أضف الماء واتركه يغلي 15 دقيقة حتى ينضج الدجاج.
  - أضف المعكرونة مباشرة إلى الصلصة (دون سلقها مسبقًا)، واطبخها حتى تتشرب الصلصة وتبقى طرية مع قليل من المرق (حوالي 15 دقيقة).
  - تُقدَّم ساخنة في صحن عميق.
- ref_external: NG-L19
  dish_form: ONE_DISH
  steps_ar:
  - نظّف السمك وقطّعه شرائح سميكة، وافرم البصل، واهرس الثوم.
  - حمّر البصل في زيت الزيتون، ثم أضف الثوم ومعجون الطماطم والطماطم المعلبة والبهارات والملح.
  - أضف الماء واتركه يغلي 5 دقائق، ثم أضف المعكرونة مباشرة إلى الصلصة.
  - بعد 8 دقائق ضع شرائح السمك فوق المعكرونة، وغطِّ القدر واتركها على نار هادئة حتى ينضج السمك وتتشرب المعكرونة الصلصة (حوالي 8 دقائق).
  - قدّمها ساخنة وفوقها قطع السمك، وانتبه للشوك عند الأكل.
- ref_external: NG-L20
  dish_form: ONE_DISH
  steps_ar:
  - اغسل الأرز ونقّعه 20 دقيقة ثم صفّه.
  - حمّر البصل المفروم في الزيت، ثم أضف قطع اللحم وقلّبها حتى يتغير لونها.
  - أضف معجون الطماطم والبهارات والملح ثم 500 غ من الماء، واترك اللحم ينضج على نار هادئة (حوالي 45 دقيقة).
  - أضف الحمص والأرز وباقي الماء (400 غ)، وغطِّ القدر على نار هادئة حتى يتشرب الأرز الماء (حوالي 20 دقيقة).
  - اقلب الرز في صحن التقديم وضع اللحم فوقه.
- ref_external: NG-L21
  dish_form: ONE_DISH
  steps_ar:
  - 'حضّر الصلصة: حمّر البصل في الزيت، وأضف اللحم ومعجون الطماطم والبهارات والملح، ثم الماء (حوالي 900 غ)، واتركها تنضج ساعة.'
  - أضف البطاطا مقطّعة أرباعًا في آخر 20 دقيقة، واسلق البيض وقشّره.
  - 'حضّر العجين: اغلِ باقي الماء (حوالي 600 غ) مع رشة ملح، وأضف دقيق الشعير دفعة واحدة واتركه يطبخ على نار هادئة 30 دقيقة دون تحريك.'
  - اعجن الدقيق المطبوخ بعصا خشبية مع قليل من الصلصة حتى يصير كتلة ملساء متماسكة.
  - شكّل العجين قبة في وسط صحن كبير، وصبّ الصلصة حوله، ورتّب اللحم والبطاطا والبيض حولها.
  - يؤكل باليد اليمنى بأخذ قطعة من العجين وغمسها في الصلصة، ويُعصر الليمون حسب الرغبة.
- ref_external: NG-L22
  dish_form: ONE_DISH
  steps_ar:
  - انقع الفاصوليا في الماء ليلة كاملة، ثم صفّها (ماء النقع لا يُحسب).
  - حمّر البصل في الزيت، ثم أضف اللحم وقلّبه حتى يتغير لونه.
  - أضف الثوم ومعجون الطماطم والبهارات والملح، ثم الفاصوليا والماء.
  - اتركها على نار هادئة حتى تنضج الفاصوليا وتتكثف الصلصة (ساعة ونصف تقريبًا، أو 40 دقيقة في قدر الضغط).
  - تُقدَّم في صحن عميق مع الخبز للغمس.
- ref_external: NG-L23
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: كفتة في صلصة، وبجانبها رز أبيض مطبوخ منفصلًا.'
  - اخلط اللحم مع نصف البصل مبشورًا والبقدونس والثوم والبيضة والكمون والفلفل والملح، وشكّلها كرات صغيرة.
  - حمّر باقي البصل في الزيت، وأضف الطماطم المعلبة والمعجون و250 غ ماء، واتركها تغلي 5 دقائق.
  - ضع كرات الكفتة في الصلصة واتركها على نار هادئة 25 دقيقة.
  - في قدر آخر اطبخ الأرز المغسول مع 400 غ ماء ورشة ملح حتى يتشرب الماء (حوالي 18 دقيقة).
  - قدّم الرز في الصحن والكفتة بصلصتها بجانبه.
- ref_external: NG-L24
  dish_form: ONE_DISH
  steps_ar:
  - قطّع اللحم قطعًا صغيرة جدًا، وافرم البصل.
  - حمّر البصل في الزيت، ثم أضف اللحم والبهارات ومعجون الطماطم وقلّبها 3 دقائق.
  - أضف الماء والملح، واترك الشربة تغلي على نار هادئة حتى ينضج اللحم (حوالي 45 دقيقة).
  - أضف الحمص وحبوب الشربة، واتركها 15 دقيقة مع التحريك حتى تنضج الحبوب وتتكثف الشربة.
  - أضف البقدونس المفروم في آخر دقيقتين، وتُقدَّم ساخنة مع الليمون.
- ref_external: NG-L25
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: مجدرة ساخنة، وبجانبها صحن زبادي بارد.'
  - اسلق العدس في 500 غ ماء 15 دقيقة (لا يستوي كاملًا).
  - قطّع البصل شرائح، وحمّره في زيت الزيتون حتى يصير بنيًا، واترك نصفه للتزيين.
  - أضف الرز البني والكمون والملح ونصف البصل وباقي الماء (400 غ) إلى العدس، وغطّه على نار هادئة حتى ينضج (حوالي 30 دقيقة).
  - قدّم المجدرة وفوقها البصل المحمّر، وبجانبها الزبادي (150 غ لكل شخص).
- ref_external: NG-L26
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الخبز مربعات صغيرة، وحمّصه في الفرن حتى يقرمش (10 دقائق).
  - سخّن الحمص مع قليل من الماء والكمون.
  - اخلط الزبادي اليوناني والزبادي مع الطحينة والثوم المهروس وعصير الليمون والملح.
  - حمّص الصنوبر في زيت الزيتون دقيقة واحدة حتى يذهب لونه.
  - 'رتّب في صحن عميق: الخبز المحمّص، ثم الحمص الساخن، ثم صلصة الزبادي، ثم الصنوبر بزيته على الوجه. تؤكل فورًا قبل أن يلين الخبز.'
- ref_external: NG-L27
  dish_form: ONE_DISH
  steps_ar:
  - انقع الفاصوليا ليلة كاملة ثم صفّها.
  - حمّر البصل في الزيت، وأضف الثوم ومعجون الطماطم والطماطم المعلبة والبهارات والملح.
  - أضف الفاصوليا والماء، واتركها على نار هادئة حتى تنضج وتتكثف الصلصة (ساعة ونصف تقريبًا).
  - تُقدَّم في صحن عميق مع الخبز للغمس.
- ref_external: NG-L28
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الدجاج مكعبات، والجزر والفلفل قطعًا صغيرة، وافرم البصل.
  - قلّب الدجاج في نصف الزيت مع الثوم والكركم والفلفل حتى يتحمّر، وارفعه جانبًا.
  - في القدر نفسه قلّب البصل والجزر والفلفل والبازلاء في باقي الزيت 3 دقائق.
  - أضف الأرز المغسول والماء والملح، وأعد الدجاج فوقه، وغطِّ القدر على نار هادئة حتى يتشرب الأرز الماء (حوالي 20 دقيقة).
  - يُقلّب بالشوكة ويُقدَّم ساخنًا.
- ref_external: NG-L29
  dish_form: ONE_DISH
  steps_ar:
  - انقع البرغل في الماء الساخن 20 دقيقة مغطّى حتى يتشرب الماء وينتفخ.
  - تبّل الدجاج بالكمون وقليل من الملح، واشوه في مقلاة مع ملعقة من الزيت حتى ينضج (6 دقائق لكل جهة)، ثم قطّعه شرائح.
  - قطّع الخيار والطماطم مكعبات صغيرة وافرم البقدونس.
  - اخلط البرغل والخضار مع عصير الليمون وباقي الزيت والملح، وضع شرائح الدجاج فوقها.
- ref_external: NG-L30
  dish_form: ONE_DISH
  steps_ar:
  - اسلق العدس في 500 غ ماء 15 دقيقة، ثم أضف الأرز و300 غ ماء واتركهما حتى ينضجا معًا (20 دقيقة).
  - اسلق المعكرونة في 400 غ ماء حتى تنضج، وصفّها.
  - قطّع البصل شرائح وحمّره في الزيت حتى يصير بنيًا.
  - اطبخ صلصة الطماطم مع الثوم والكمون والفلفل الحار وعصير الليمون 10 دقائق.
  - 'رتّب في الصحن: العدس بالأرز، ثم المعكرونة، ثم الحمص، ثم الصلصة، ثم البصل المحمّر على الوجه.'
- ref_external: NG-L31
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: أسياخ دجاج مشوي، وبجانبها رز أبيض.'
  - قطّع الدجاج مكعبات، واخلطه مع الزبادي والليمون والثوم والبابريكا ومعجون الطماطم ونصف الزيت والملح، واتركه في الثلاجة ساعتين على الأقل.
  - اشكّ الدجاج في أسياخ، واشوه في الفرن أو على الشواية 15 دقيقة مع التقليب.
  - اطبخ الأرز المغسول مع الماء وباقي الزيت ورشة ملح حتى يتشرب الماء (18 دقيقة).
  - قدّم الأسياخ فوق الرز أو بجانبه.
- ref_external: NG-L32
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: سمك مشوي، وبجانبه رز بالبصل.'
  - تبّل السمك بالليمون والثوم والكمون والبابريكا ونصف الزيت والملح، واتركه 30 دقيقة.
  - اشوِ السمك في الفرن على حرارة 200 درجة 20 دقيقة، أو على الشواية.
  - حمّر البصل المفروم في باقي الزيت، وأضف الأرز والماء ورشة ملح حتى ينضج (18 دقيقة).
  - قدّم السمك بجانب الرز، وانتبه للشوك.
- ref_external: NG-D12
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: سردين وسلطة وخبز في صحن واحد.'
  - صفِّ السردين من الزيت، ويمكن تسخينه دقيقتين في مقلاة.
  - قطّع الخس والطماطم والخيار، وتبّلها بالليمون وزيت الزيتون.
  - ضع السردين بجانب السلطة مع الخبز.
- ref_external: NG-D13
  dish_form: ONE_DISH
  steps_ar:
  - تبّل الدجاج بالبابريكا والملح، واشوه في مقلاة مع زيت الزيتون حتى ينضج (6 دقائق لكل جهة)، ثم قطّعه شرائح.
  - اخلط الزبادي مع الثوم المهروس لعمل صلصة الثوم.
  - افرد الصلصة على الخبز، وضع الدجاج والخس والطماطم، ثم لفّ الرغيف.
- ref_external: NG-D14
  dish_form: ONE_DISH
  steps_ar:
  - اشوِ الفلفل والطماطم والبصل في الفرن أو على النار حتى يسودّ قشرها، ثم ضعها في كيس مغلق 10 دقائق.
  - قشّرها وافرمها ناعمًا مع الثوم.
  - أضف زيت الزيتون والكراوية والملح واخلطها.
  - ضعها في صحن، وفوقها التونة والبيض المسلوق مقطّعًا. تؤكل باردة مع الخبز إن رغبت.
- ref_external: NG-D15
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: بطاطا مسلوقة وبيض مسلوق في صحن واحد.'
  - اسلق البطاطا بقشرها حتى تنضج (20 دقيقة)، ثم قشّرها وقطّعها مكعبات.
  - اسلق البيض 10 دقائق وقشّره وقطّعه أنصافًا.
  - رشّ على البطاطا والبيض الكمون والملح وزيت الزيتون، وتؤكل ساخنة أو دافئة.
- ref_external: NG-D16
  dish_form: ONE_DISH
  steps_ar:
  - اغسل العدس، وقطّع البصل والجزر والبطاطا قطعًا صغيرة.
  - قلّب البصل في الزيت حتى يذبل، ثم أضف الثوم والجزر والبطاطا والعدس والبهارات.
  - أضف الماء والملح، واتركها تغلي على نار هادئة حتى ينضج العدس (30 دقيقة).
  - اهرسها بالخلاط اليدوي إن أردتها ناعمة، وتُقدَّم ساخنة مع الليمون.
- ref_external: NG-D17
  dish_form: ONE_DISH
  steps_ar:
  - اغسل البرغل وانقعه 10 دقائق في عصير الليمون فقط حتى يلين.
  - افرم البقدونس فرمًا ناعمًا جدًا، وقطّع الطماطم والبصل مكعبات صغيرة.
  - اخلط كل المكوّنات مع زيت الزيتون والملح قبل الأكل مباشرة.
  - تؤكل بأوراق الخس كملعقة.
- ref_external: NG-D18
  dish_form: ONE_DISH
  steps_ar:
  - سخّن الفرن على 200 درجة.
  - قطّع الخضار شرائح، واخلطها مع نصف الزيت وقليل من الملح، ورتّبها في صينية.
  - تبّل السمك بالليمون والثوم والكمون وباقي الزيت والملح، وضعه فوق الخضار.
  - غطِّ الصينية بورق القصدير، واخبزها 20 دقيقة، ثم اكشفها 5 دقائق.
  - يُقدَّم السمك مع الخضار من الصينية نفسها.
- ref_external: NG-S10
  dish_form: ONE_DISH
  steps_ar:
  - ضع كل المكوّنات في الخلاط.
  - اخلطها دقيقة حتى يصير المشروب ناعمًا.
  - يُشرب باردًا فورًا، ويمكن إضافة مكعبات ثلج.
- ref_external: NG-S11
  dish_form: ONE_DISH
  steps_ar:
  - ابشر الخيار أو قطّعه مكعبات صغيرة.
  - اخلطه مع الزبادي والثوم المهروس والملح.
  - صبّ قليلًا من زيت الزيتون على الوجه، ويؤكل باردًا بالملعقة.
- ref_external: NG-S12
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب خفيف: بيض مسلوق وخبز وخيار.'
  - اسلق البيض 10 دقائق، ثم قشّره.
  - قدّمه مع شريحة الخبز والخيار، ورشّ الملح والكمون على البيض.
- ref_external: NG-S13
  dish_form: PLATE
  steps_ar:
  - قطّع الجزر والخيار والفلفل أصابع طويلة.
  - ضع الحمص في وعاء صغير وسط الصحن.
  - تؤكل بغمس أصابع الخضار في الحمص.
- ref_external: NG-S14
  dish_form: ONE_DISH
  steps_ar:
  - تؤكل حفنة اللوز كما هي، نيئة أو محمّصة بدون ملح.
