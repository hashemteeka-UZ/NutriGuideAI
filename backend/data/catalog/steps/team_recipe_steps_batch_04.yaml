default_lang: ar
note: Preparation steps per meal; loaded only after the meal_steps migration .
meals:
- ref_external: NG-B23
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: بيض مقلي، وبجانبه خبز وطماطم مقطّعة.'
  - سخّن زيت الزيتون في مقلاة على نار متوسطة، واكسر البيض فيها.
  - رشّ الملح والكمون، واتركه حتى يتماسك البياض ويبقى الصفار كما تحب (3 دقائق).
  - قدّمه مع الخبز والطماطم المقطّعة.
- ref_external: NG-B24
  dish_form: ONE_DISH
  steps_ar:
  - اخلط دقيق الشعير ودقيق القمح مع الخميرة والملح، وأضف الماء الفاتر و15 غ من الزيت تدريجيًا، واعجنها 10 دقائق.
  - اتركها تتخمر ساعة في مكان دافئ، ثم شكّلها رغيفًا مستديرًا واتركها 20 دقيقة أخرى.
  - اخبزها على 220 درجة حتى يتحمّر وجهها (حوالي 30 دقيقة)، واتركها تبرد قليلًا.
  - قطّع الخبز إلى 6 حصص، وتؤكل كل حصة بتغميسها في زيت الزيتون.
- ref_external: NG-B25
  dish_form: ONE_DISH
  steps_ar:
  - اغلِ الماء مع رشة الملح في قدر عميق.
  - أضف الدقيق دفعة واحدة في وسط الماء، واتركه على نار هادئة 10 دقائق دون تحريك.
  - حرّك العجين بعصا خشبية بقوة حتى يصير كتلة ملساء متماسكة (حوالي 10 دقائق)، وأضف قليلًا من الماء الساخن إن جفّ.
  - شكّلها قبة في صحن، واعمل حفرة في وسطها، وصبّ فيها العسل وزيت الزيتون.
  - تؤكل دافئة باليد أو الملعقة بتغميس قطعة من العصيدة في العسل والزيت.
- ref_external: NG-B26
  dish_form: ONE_DISH
  steps_ar:
  - اعجن الدقيق مع الخميرة والملح والماء الفاتر حتى تصير عجينة لينة جدًا ولزجة، واتركها تتخمر ساعة.
  - سخّن الزيت في مقلاة عميقة، وبلّل يدك بالماء، وخذ كرة من العجين وافردها بأصابعك قرصًا رفيعًا.
  - ضع القرص في الزيت الساخن، واكسر فوقه بيضة، واقلبه حتى يتحمّر من الجهتين وينضج البيض (حوالي 3 دقائق).
  - صفّه على ورق ماص، ويُقدَّم ساخنًا مع الشاي.
- ref_external: NG-B27
  dish_form: ONE_DISH
  steps_ar:
  - قطّع البصل شرائح، والطماطم مكعبات، والفلفل الحار حلقات.
  - حمّر البصل في الزيت حتى يذبل، ثم أضف الفلفل والطماطم والكركم والملح، واتركها حتى تلين (5 دقائق).
  - اخفق البيض وصبّه فوق الطماطم، وحرّكه بهدوء حتى يتماسك.
  - قدّمه ساخنًا مع الخبز.
- ref_external: NG-B28
  dish_form: ONE_DISH
  steps_ar:
  - اعجن الدقيقين مع الخميرة والملح والماء الفاتر و20 غ من الزيت حتى تصير عجينة لينة، واتركها تتخمر ساعة.
  - قسّم العجينة إلى 6 كرات، وافردها أقراصًا رفيعة.
  - ادهن كل قرص بالزبدة المذابة، واطوه مربعًا، ثم افرده مرة ثانية.
  - اخبزه على صاج أو مقلاة غير لاصقة مدهونة بباقي الزيت حتى يتحمّر من الجهتين (حوالي 4 دقائق).
  - صبّ 15 غ من العسل على كل فطيرة، وتُقدَّم ساخنة.
- ref_external: NG-B29
  dish_form: ONE_DISH
  steps_ar:
  - يُقدَّم كوب اللبن باردًا.
- ref_external: NG-B30
  dish_form: ONE_DISH
  steps_ar:
  - اعصر 3 إلى 4 برتقالات (حوالي كوب)، ويُشرب طازجًا دون سكر.
- ref_external: NG-B31
  dish_form: ONE_DISH
  steps_ar:
  - اعجن الدقيقين مع الخميرة والملح والماء الفاتر و15 غ من الزيت حتى تصير عجينة لينة، واتركها تتخمر ساعة.
  - قسّم العجينة إلى 12 كرات، وافردها أقراصًا رفيعة.
  - قطّع السبانخ وافركها بقليل من الملح ثم اعصرها من مائها، واخلطها مع البصل المفروم وعصير الليمون وباقي الزيت والفلفل.
  - ضع ملعقة من الحشوة في وسط كل قرص، واجمع أطرافه على شكل مثلث وأغلقه جيدًا.
  - اخبزها على 200 درجة حتى تتحمّر (حوالي 20 دقيقة). الحصة فطيرتان.
- ref_external: NG-B32
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: صحن حمص بالطحينة، وبجانبه خبز وخضار.'
  - اطحن الحمص في الخلاط مع الطحينة وعصير الليمون والثوم والكمون (الحمص المعلب مملّح، فلا يُضاف ملح)، وأضف الماء البارد تدريجيًا حتى يصير ناعمًا.
  - افرده في صحن، وصبّ زيت الزيتون على الوجه.
  - قدّمه مع الخبز والخيار والطماطم المقطّعة.
- ref_external: NG-B33
  dish_form: ONE_DISH
  steps_ar:
  - اعجن الدقيقين مع الخميرة والملح والماء الفاتر و10 غ من الزيت حتى تصير عجينة لينة، واتركها تتخمر ساعة.
  - قسّم العجينة إلى 6 كرات، وافردها أقراصًا رفيعة.
  - اخلط الزعتر والسمسم مع باقي زيت الزيتون حتى يصير خليطًا كثيفًا.
  - اضغط على كل قرص بأطراف أصابعك، وافرد عليه طبقة من خليط الزعتر.
  - اخبزها على 230 درجة حتى تتحمّر الأطراف (حوالي 10 دقائق). الحصة منقوشة واحدة.
- ref_external: NG-B34
  dish_form: ONE_DISH
  steps_ar:
  - اعجن الدقيقين مع الخميرة والملح والماء الفاتر و15 غ من الزيت حتى تصير عجينة لينة، واتركها تتخمر ساعة.
  - قسّم العجينة إلى 6 كرات، وافردها أقراصًا رفيعة.
  - ابشر الموزاريلا وفتّت الجبن الأبيض واخلطهما، ووزّعهما على الأقراص، ورشّ السمسم.
  - اخبزها على 230 درجة حتى يذوب الجبن وتتحمّر الأطراف (حوالي 10 دقائق). الحصة منقوشة واحدة.
- ref_external: NG-B35
  dish_form: ONE_DISH
  steps_ar:
  - سخّن الحمص في قليل من الماء حتى يصير دافئًا ولينًا.
  - اخفق الطحينة مع عصير الليمون والثوم المهروس والماء الساخن حتى تصير صلصة (الحمص المعلب مملّح، فلا يُضاف ملح).
  - ضع الحمص الدافئ حبّاته كاملة في صحن، وصبّ صلصة الطحينة فوقه.
  - رشّ الكمون والبقدونس المفروم وزيت الزيتون، وتُقدَّم مع الخبز.
- ref_external: NG-B36
  dish_form: ONE_DISH
  steps_ar:
  - قشّر البندورة وقطّعها مكعبات صغيرة.
  - سخّن زيت الزيتون مع الثوم دقيقة، وأضف البندورة والملح واتركها حتى يتبخر معظم مائها (8 دقائق).
  - اكسر البيض فوق البندورة وحرّكه حتى يتماسك ويختلط بها.
  - رشّ الفلفل الأسود، وقدّمه مع الخبز.
- ref_external: NG-B37
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: أقراص فلافل مخبوزة، وبجانبها خبز وطماطم وصلصة طحينة.'
  - انقع الحمص الجاف 12 ساعة ثم صفّه (لا يُسلق، وماء النقع لا يُحسب).
  - اطحنه مع البصل والبقدونس والكزبرة والثوم والكمون والملح، ثم أضف البيكربونات واتركه نصف ساعة.
  - شكّل أقراصًا صغيرة، وادهنها بزيت الزيتون، واخبزها على 200 درجة مع قلبها مرة (حوالي 25 دقيقة).
  - اخفق الطحينة مع عصير الليمون وقليل من الماء، وقدّم الفلافل مع الخبز والطماطم والصلصة.
- ref_external: NG-B38
  dish_form: ONE_DISH
  steps_ar:
  - افتح رغيف العيش البلدي من جانبه.
  - اهرس الجبنة البيضاء مع زيت الزيتون والكمون، وقطّع الطماطم والخيار مكعبات صغيرة.
  - احشُ الرغيف بالجبنة والخضار، ويؤكل باردًا.
- ref_external: NG-B39
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: طعمية مخبوزة، وبجانبها عيش وسلطة طماطم وخيار.'
  - انقع الفول المدشوش 12 ساعة ثم صفّه (ماء النقع لا يُحسب).
  - اطحنه مع البصل والبقدونس والكزبرة والثوم والكمون والملح حتى يصير عجينة خضراء، ثم أضف البيكربونات.
  - شكّل أقراصًا، ورشّ عليها السمسم، وادهنها بالزيت، واخبزها على 200 درجة مع قلبها مرة (حوالي 25 دقيقة).
  - قدّمها مع العيش والسلطة.
- ref_external: NG-B40
  dish_form: ONE_DISH
  steps_ar:
  - حمّص شريحتي الخبز.
  - ادهن كل شريحة بزبدة الفول السوداني.
  - قطّع الموز شرائح ورتّبها فوقها، ورشّ القرفة.
- ref_external: NG-B41
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الفلفل والفطر والطماطم والبصل قطعًا صغيرة، وقلّبها في الزيت 3 دقائق.
  - اخفق البيض وبياض البيض مع الملح والفلفل، وصبّه فوق الخضار.
  - غطِّ المقلاة على نار هادئة حتى يتماسك الوجه (4 دقائق)، ثم اطوِ الأومليت نصفين.
  - قدّمه مع الخبز الأسمر المحمّص.
- ref_external: NG-B42
  dish_form: ONE_DISH
  steps_ar:
  - يُشرب كوب الحليب باردًا أو دافئًا، دون سكر.
