note: Preparation steps per meal; loaded only after the meal_steps migration .
meals:
- ref_external: NG-L33
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الكوسا والبطاطا والفلفل مكعبات، وافرم البصل، واهرس الثوم.
  - حمّر البصل في زيت الزيتون، ثم أضف الثوم ومعجون الطماطم والطماطم المعلبة والبهارات والملح، وقلّب دقيقتين.
  - أضف الماء والبطاطا والحمص، واتركها تغلي 10 دقائق.
  - أضف المعكرونة مباشرة إلى الصلصة (دون سلقها مسبقًا) مع الكوسا والفلفل، واطبخها حتى تتشرب الصلصة وتبقى طرية مع قليل من المرق (حوالي 15 دقيقة).
  - تُقدَّم ساخنة في صحن عميق.
- ref_external: NG-L34
  dish_form: ONE_DISH
  steps_ar:
  - قطّع اللحم قطعًا صغيرة، وافرم البصل، واهرس الثوم.
  - حمّر البصل في زيت الزيتون، ثم أضف اللحم وقلّبه حتى يتغير لونه.
  - أضف الثوم ومعجون الطماطم والطماطم المعلبة والبهارات والملح، ثم الماء، واترك اللحم ينضج على نار هادئة (حوالي 40 دقيقة).
  - أضف المعكرونة مباشرة إلى الصلصة، واطبخها حتى تتشرب الصلصة وتبقى طرية مع قليل من المرق (حوالي 15 دقيقة).
  - تُقدَّم ساخنة في صحن عميق.
- ref_external: NG-L35
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: دجاج مشوي، وبجانبه سلطة طماطم وخيار وخبز.'
  - اهرس الثوم واخلطه مع الكمون والفلفل الأحمر والفلفل الأسود والملح ونصف عصير الليمون و20 غ من الزيت.
  - تبّل الدجاج بالخلطة واتركه ساعة على الأقل في الثلاجة.
  - اشوِه على الفحم أو في الفرن على 220 درجة حتى ينضج ويتحمّر (حوالي 30 دقيقة).
  - قطّع الطماطم والخيار والبصل مكعبات صغيرة، وتبّلها بباقي الليمون والزيت.
  - قدّم الدجاج مع السلطة والخبز.
- ref_external: NG-L36
  dish_form: ONE_DISH
  steps_ar:
  - انقع الحمص ليلة كاملة ثم صفّه (ماء النقع لا يُحسب)، واسلقه في الماء حتى ينضج نصف نضج (حوالي 40 دقيقة).
  - اغسل السلق جيدًا وقطّعه قطعًا متوسطة (الأوراق والعروق معًا). السلق مالح بطبيعته، لذلك الملح المضاف قليل.
  - حمّر البصل المفروم في الزيت، ثم أضف الثوم ومعجون الطماطم والبهارات والملح وقلّب دقيقة.
  - أضف السلق وقلّبه حتى يذبل، ثم أضف الحمص بمائه.
  - اتركها على نار هادئة حتى ينضج السلق وتتكثف الصلصة (حوالي 25 دقيقة).
  - تُقدَّم في صحن عميق مع الخبز للغمس.
- ref_external: NG-L37
  dish_form: ONE_DISH
  steps_ar:
  - حمّر البصل في الزيت، ثم أضف اللحم ومعجون الطماطم والبهارات والملح وقلّب حتى يتغير لون اللحم.
  - أضف الماء واتركه على نار هادئة حتى ينضج اللحم (حوالي 50 دقيقة).
  - أضف القرع والبطاطا والجزر والكوسا والحمص، واتركها حتى تنضج الخضار (حوالي 25 دقيقة).
  - فوّر الكسكسي على بخار المرق في الكسكاس مرتين، وفي كل مرة رشّه بقليل من المرق وفكّكه بيدك.
  - ضع الكسكسي في صحن كبير، ورتّب اللحم والخضار فوقه، وصبّ قليلًا من المرق حسب الرغبة.
- ref_external: NG-L38
  dish_form: ONE_DISH
  steps_ar:
  - حمّر البصل في الزيت، ثم أضف الدجاج ومعجون الطماطم والبهارات والملح وقلّب حتى يتغير لون الدجاج.
  - أضف الماء واتركه على نار هادئة حتى ينضج الدجاج (حوالي 25 دقيقة).
  - أضف القرع والبطاطا والجزر والكوسا والحمص، واتركها حتى تنضج الخضار (حوالي 25 دقيقة).
  - فوّر الكسكسي على بخار المرق في الكسكاس مرتين، وفي كل مرة رشّه بقليل من المرق وفكّكه بيدك.
  - ضع الكسكسي في صحن كبير، ورتّب الدجاج والخضار فوقه، وصبّ قليلًا من المرق حسب الرغبة.
- ref_external: NG-L39
  dish_form: ONE_DISH
  steps_ar:
  - تبّل الحوت بنصف الكمون وقليل من الملح، واغسل الأرز ونقّعه 20 دقيقة ثم صفّه.
  - حمّر البصل المفروم في الزيت، ثم أضف الثوم ومعجون الطماطم وباقي البهارات والملح، ثم الماء، واتركه يغلي 5 دقائق.
  - ضع قطع الحوت في المرق 8 دقائق حتى تنضج، ثم ارفعها جانبًا.
  - أضف الأرز إلى المرق، وغطِّ القدر على نار هادئة حتى يتشرب الأرز الماء (حوالي 20 دقيقة).
  - قدّم الرز في الصحن وقطع الحوت فوقه، مع الليمون حسب الرغبة، وانتبه للشوك.
- ref_external: NG-L40
  dish_form: ONE_DISH
  steps_ar:
  - قطّع اللحم قطعًا متوسطة، وافرم البصل، واهرس الثوم.
  - حمّر البصل في الزيت، ثم أضف اللحم وقلّبه حتى يتغير لونه.
  - أضف الثوم ومعجون الطماطم والبهارات والملح، ثم الماء، واترك اللحم ينضج على نار هادئة (حوالي 45 دقيقة).
  - أضف البطاطا مقطّعة مكعبات كبيرة، واتركها حتى تنضج وتتكثف الصلصة (حوالي 25 دقيقة).
  - تُقدَّم في صحن عميق مع الخبز للغمس.
- ref_external: NG-L41
  dish_form: ONE_DISH
  steps_ar:
  - قطّع اللحم قطعًا متوسطة، وافرم البصل، واهرس الثوم.
  - حمّر البصل في الزيت، ثم أضف اللحم وقلّبه حتى يتغير لونه.
  - أضف الثوم ومعجون الطماطم والبهارات والملح، ثم الماء، واترك اللحم ينضج على نار هادئة (حوالي 45 دقيقة).
  - أضف البامية (بعد قص أطرافها) والطماطم المعلبة، واتركها على نار هادئة حتى تنضج البامية (حوالي 25 دقيقة) دون تحريك كثير.
  - أضف الكزبرة المفرومة في آخر 5 دقائق، وتُقدَّم مع الخبز.
- ref_external: NG-L42
  dish_form: ONE_DISH
  steps_ar:
  - قطّع اللحم قطعًا متوسطة، وافرم البصل، واهرس الثوم.
  - حمّر البصل في الزيت، ثم أضف اللحم وقلّبه حتى يتغير لونه.
  - أضف الثوم ومعجون الطماطم والبهارات والملح، ثم الماء، واترك اللحم ينضج على نار هادئة (حوالي 45 دقيقة).
  - أضف الكوسا مقطّعة أصابع سميكة مع الحمص، واتركها حتى تنضج الكوسا (حوالي 15 دقيقة).
  - تُقدَّم في صحن عميق مع الخبز.
- ref_external: NG-L43
  dish_form: ONE_DISH
  steps_ar:
  - قطّع اللحم قطعًا متوسطة، وتبّله بالثوم والبهارات ونصف الملح.
  - حمّر البصل في الزيت مع اللحم 5 دقائق، ثم أضف معجون الطماطم والماء واتركه ينضج نصف نضج (30 دقيقة).
  - قطّع البطاطا أصابع أو شرائح، والطماطم والفلفل شرائح.
  - رتّب البطاطا في صينية الفرن، وضع اللحم بمرقه فوقها، ثم شرائح الطماطم والفلفل، ورشّ باقي الملح.
  - اخبزه في الفرن على 200 درجة مغطى بورق القصدير 30 دقيقة، ثم دون غطاء حتى يتحمّر (حوالي 15 دقيقة).
- ref_external: NG-L44
  dish_form: ONE_DISH
  steps_ar:
  - تبّل شرائح الحوت بالثوم المهروس والكمون وعصير الليمون ونصف الملح، واتركها 30 دقيقة.
  - قطّع البطاطا شرائح رفيعة، ورتّبها في صينية الفرن مع البصل، واخبزها 15 دقيقة على 200 درجة.
  - اخلط معجون الطماطم بالماء والزيت والفلفل الحار والفلفل الأحمر وباقي الملح.
  - رتّب الحوت فوق البطاطا، ثم شرائح الطماطم والفلفل، وصبّ الصلصة فوقها.
  - أعدها إلى الفرن حتى ينضج الحوت ويتحمّر الوجه (حوالي 25 دقيقة)، وانتبه للشوك عند الأكل.
- ref_external: NG-L45
  dish_form: ONE_DISH
  steps_ar:
  - حمّر البصل المفروم شرائح في الزيت، ثم أضف الدجاج والكركم والقرفة والفلفل والملح.
  - أضف الماء والحمص، واترك المرق على نار هادئة حتى ينضج الدجاج (حوالي 30 دقيقة).
  - ضع الرشتة في الكسكاس فوق المرق، وفوّرها على البخار مرتين، وفي كل مرة رشّها بقليل من المرق وفكّكها بيدك.
  - اخلط الرشتة في صحن كبير بمغرفة من المرق، ورتّب الدجاج والحمص فوقها.
  - تُقدَّم ساخنة، ويُصبّ باقي المرق حسب الرغبة.
- ref_external: NG-L46
  dish_form: ONE_DISH
  steps_ar:
  - اسلق البصل الكبير 5 دقائق وافصل طبقاته، وافرغ الطماطم والفلفل من الداخل (يُحفظ لب الطماطم للصلصة).
  - اخلط الأرز المغسول مع اللحم المفروم والبقدونس ونصف معجون الطماطم والبهارات والملح.
  - احشُ طبقات البصل والطماطم والفلفل بالخلطة دون ملئها تمامًا لأن الأرز ينتفخ.
  - رتّبها في القدر، واخلط الماء مع لب الطماطم وباقي المعجون والزيت وصبّه فوقها.
  - اطبخها مغطاة على نار هادئة حتى ينضج الأرز (حوالي 45 دقيقة).
- ref_external: NG-L47
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: مبطن بطاطا مقلي، وبجانبه سلطة طماطم وخيار.'
  - اخلط اللحم مع البصل المبشور والبقدونس والقرفة والفلفل ونصف الملح.
  - قطّع البطاطا شرائح سميكة (حوالي 1 سم)، واشقق كل شريحة من الوسط دون فصلها، واحشها بطبقة رفيعة من اللحم.
  - غلّف كل قطعة بالدقيق ثم البيض المخفوق مع باقي الملح.
  - اقلها في زيت ساخن على نار متوسطة حتى تنضج البطاطا واللحم وتتحمّر (حوالي 6 دقائق لكل دفعة)، ثم صفّها على ورق ماص.
  - قطّع الطماطم والخيار وتبّلهما بالليمون، وقدّم السلطة بجانب المبطن.
- ref_external: NG-L48
  dish_form: ONE_DISH
  steps_ar:
  - 'حضّر الصلصة: حمّر البصل في الزيت، ثم أضف اللحم ومعجون الطماطم والبهارات والملح، ثم الماء والحمص، واتركها تنضج (حوالي 45 دقيقة).'
  - ادهن المعكرونة بقليل من الصلصة، وضعها في الكسكاس فوق القدر لتنضج على البخار (حوالي 20 دقيقة).
  - انقل المعكرونة إلى القدر واخلطها مع جزء من الصلصة، واتركها دقيقتين على النار حتى تتشرب.
  - قدّمها في صحن كبير، ورتّب اللحم والحمص فوقها مع باقي الصلصة.
- ref_external: NG-L49
  dish_form: ONE_DISH
  steps_ar:
  - قطّع الطماطم والخيار والفلفل والبصل مكعبات صغيرة جدًا، وافرم البقدونس.
  - اخلطها في وعاء مع عصير الليمون وزيت الزيتون والفلفل الحار ورشة الملح.
  - وزّع التن المصفّى والزيتون على الوجه.
  - تُقدَّم باردة مع الخبز الأسمر.
- ref_external: NG-L50
  dish_form: ONE_DISH
  steps_ar:
  - اغسل العدس، وقطّع البطاطا والجزر مكعبات.
  - حمّر البصل في الزيت، ثم أضف الثوم ومعجون الطماطم والبهارات والملح.
  - أضف العدس والماء، واتركه يغلي على نار هادئة 15 دقيقة.
  - أضف البطاطا والجزر، واتركها حتى تنضج الخضار ويتكثف العدس (حوالي 25 دقيقة).
  - يُقدَّم في صحن عميق مع الخبز.
- ref_external: NG-L51
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: لحم بصلصة اللبن، وبجانبه رز أبيض.'
  - اسلق اللحم مع البصل والقرفة والفلفل و400 غ ماء حتى ينضج (حوالي ساعة).
  - اخفق الزبادي مع الدقيق جيدًا، وضعه على نار هادئة مع التحريك المستمر باتجاه واحد حتى يغلي (حتى لا يتكتل).
  - أضف اللحم مع قليل من مرقه إلى اللبن، والثوم المقلي بالزيت والملح، واتركه 10 دقائق.
  - اطبخ الأرز المغسول مع 400 غ ماء ورشة ملح حتى يتشرب الماء، وقدّمه بجانب الشاكرية.
- ref_external: NG-L52
  dish_form: PLATE
  steps_ar:
  - انقع البرغل في الماء 15 دقيقة حتى يتشربه.
  - اعجن البرغل مع 500 غ من اللحم وثلث البصل مبشورًا ونصف البهارات والملح حتى تصير عجينة متماسكة.
  - 'حضّر الحشوة: قلّب باقي اللحم (300 غ) مع باقي البصل مفرومًا والصنوبر وباقي البهارات في 10 غ من الزيت حتى ينضج.'
  - افرد نصف العجينة في صينية مدهونة، ثم الحشوة، ثم النصف الآخر من العجينة، وقطّعها مربعات أو معينات، وادهن الوجه بباقي الزيت.
  - اخبزها على 200 درجة حتى تتحمّر (حوالي 35 دقيقة).
  - تُقدَّم مع الزبادي بجانبها.
- ref_external: NG-L53
  dish_form: ONE_DISH
  steps_ar:
  - تبّل الدجاج بالقرفة والفلفل ونصف الملح، واشوه في الفرن على 200 درجة حتى ينضج (حوالي 35 دقيقة).
  - قطّع البصل شرائح رفيعة، واطهه في الزيت على نار هادئة مع باقي الملح حتى يذبل ويصير ذهبيًا (حوالي 20 دقيقة).
  - يُرشّ السماق على البصل حسب الرغبة (السماق غير محسوب في القيم الغذائية).
  - افرد البصل على أرغفة الخبز، وضع الدجاج فوقه، ورشّ الصنوبر المحمّص.
  - أدخلها الفرن 5 دقائق حتى يتحمّص الخبز قليلًا، وتُقدَّم ساخنة.
- ref_external: NG-L54
  dish_form: ONE_DISH
  steps_ar:
  - اسلق العدس في الماء حتى ينضج نصف نضج (حوالي 20 دقيقة).
  - أضف البطاطا مكعبات والسلق المقطّع، واتركها حتى تنضج (حوالي 15 دقيقة).
  - حمّر البصل في الزيت، ثم أضف الثوم والكزبرة المفرومة دقيقة، وأضفها إلى القدر مع الكمون والملح.
  - اخلط الدقيق مع عصير الليمون وقليل من الماء، وأضفه إلى القدر مع التحريك حتى يتكثف (5 دقائق).
  - يُقدَّم ساخنًا أو دافئًا مع الخبز.
- ref_external: NG-L55
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: فاصوليا خضراء مطبوخة بالزيت، وبجانبها رز أبيض.'
  - قطّع الفاصوليا قطعًا بطول 3 سم، وافرم البصل، وقطّع الطماطم مكعبات.
  - حمّر البصل في زيت الزيتون، ثم أضف الثوم والفاصوليا وقلّبها 5 دقائق.
  - أضف الطماطم والملح والفلفل، وغطِّ القدر على نار هادئة حتى تنضج الفاصوليا بماء الطماطم (حوالي 35 دقيقة).
  - اطبخ الأرز المغسول مع الماء ورشة ملح حتى يتشربه، وقدّمه بجانب الفاصوليا.
- ref_external: NG-L56
  dish_form: ONE_DISH
  steps_ar:
  - اخلط اللحم مع البصل المبشور والبقدونس والقرفة والفلفل ومعظم الملح، وشكّله أقراصًا أو أصابع.
  - قطّع البطاطا شرائح، واخلطها مع الزيت، ورتّبها في صينية مع الكفتة، واخبزها على 200 درجة 25 دقيقة.
  - اخفق الطحينة مع عصير الليمون والثوم المهروس والماء وباقي الملح حتى تصير صلصة سائلة.
  - صبّ صلصة الطحينة فوق الكفتة والبطاطا، وأعدها إلى الفرن حتى تغلي الصلصة وتتحمّر قليلًا (حوالي 10 دقائق).
- ref_external: NG-L57
  dish_form: ONE_DISH
  steps_ar:
  - قطّع البصل شرائح، واطهه في الزيت على نار متوسطة حتى يصير بنيًا غامقًا دون أن يحترق (حوالي 20 دقيقة).
  - أضف الماء إلى البصل مع الكمون والكركم والقرفة والملح، واتركه يغلي 10 دقائق، ثم صفّ المرق إن أردت لونًا ناعمًا.
  - تبّل السمك بالليمون وقليل من الكمون، واطبخه في المرق 8 دقائق ثم ارفعه.
  - أضف الأرز المغسول إلى المرق، وغطِّ القدر حتى يتشرب الماء (حوالي 20 دقيقة).
  - قدّم الرز البني اللون في صحن، والسمك فوقه، ورشّ الصنوبر واللوز المحمّصين.
- ref_external: NG-L58
  dish_form: ONE_DISH
  steps_ar:
  - اسلق الدجاج مع نصف البصل والبهارات في الماء حتى ينضج (حوالي 30 دقيقة)، ثم ارفعه واحتفظ بالمرق (حوالي 600 غ).
  - حمّر باقي البصل في الزيت، وأضف البرغل وقلّبه دقيقتين.
  - أضف المرق والملح، وغطِّ القدر على نار هادئة حتى يتشرب البرغل المرق (حوالي 15 دقيقة).
  - قطّع الدجاج قطعًا وضعه فوق البرغل، ورشّ اللوز المحمّص.
- ref_external: NG-L59
  dish_form: ONE_DISH
  steps_ar:
  - اسلق ورق العنب في ماء مغلي دقيقتين حتى يلين، ثم صفّه.
  - اخلط الأرز المغسول مع الطماطم والبصل والبقدونس مفرومة ناعمًا، ونصف الزيت والملح والفلفل.
  - ضع ملعقة صغيرة من الحشوة على كل ورقة، ولفّها لفًّا محكمًا.
  - رصّ الأصابع في القدر، وصبّ فوقها الماء وعصير الليمون وباقي الزيت، وضع صحنًا مقلوبًا فوقها حتى لا تتفكك.
  - اطبخها على نار هادئة حتى ينضج الأرز (حوالي 50 دقيقة)، وتُقدَّم باردة أو دافئة.
- ref_external: NG-L60
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: يخنة بازلاء باللحم، وبجانبها رز أبيض.'
  - قطّع اللحم مكعبات صغيرة، وحمّره مع البصل في الزيت.
  - أضف الثوم ومعجون الطماطم والبهارات والملح و500 غ ماء، واترك اللحم ينضج (حوالي 45 دقيقة).
  - أضف البازلاء والجزر مكعبات، واتركها حتى تنضج (حوالي 20 دقيقة).
  - اطبخ الأرز المغسول مع 400 غ ماء ورشة ملح، وقدّمه بجانب اليخنة.
- ref_external: NG-L61
  dish_form: PLATE
  steps_ar:
  - 'هذا طبق مركّب: مسقعة في صينية، وبجانبها رز أبيض.'
  - قطّع الباذنجان شرائح، وادهنها بـ 25 غ من الزيت، واشوها في الفرن على 220 درجة حتى تتحمّر (حوالي 20 دقيقة) بدل قليها.
  - قلّب اللحم المفروم مع البصل في باقي الزيت حتى ينضج، ثم أضف الثوم والفلفل والطماطم والمعجون والبهارات والملح، واتركها 10 دقائق.
  - رتّب الباذنجان في صينية، وصبّ صلصة اللحم فوقه، واخبزها 20 دقيقة.
  - اطبخ الأرز المغسول مع الماء ورشة ملح، وقدّمه بجانب المسقعة.
- ref_external: NG-L62
  dish_form: ONE_DISH
  steps_ar:
  - افصل أوراق الكرنب، واسلقها في ماء مغلي 5 دقائق حتى تلين، وأزل العرق السميك.
  - اخلط الأرز المغسول مع اللحم والطماطم المفرومة والبصل والبقدونس والكزبرة والكمون ونصف المعجون والملح.
  - قطّع الأوراق الكبيرة نصفين، وضع ملعقة من الحشوة ولفّها أصابع.
  - رصّ الأصابع في القدر، واخلط الماء مع باقي المعجون والثوم والزيت وصبّه فوقها، وضع صحنًا مقلوبًا فوقها.
  - اطبخها على نار هادئة حتى ينضج الأرز (حوالي 45 دقيقة).
- ref_external: NG-L63
  dish_form: ONE_DISH
  steps_ar:
  - اسلق المعكرونة في ماء مغلي حسب الوقت على العبوة، ثم صفّها (الماء الذي تمتصه المعكرونة محسوب، وماء السلق لا يُحسب).
  - قطّع الدجاج مكعبات، وقلّبه في نصف الزيت حتى ينضج ويتحمّر، ثم ارفعه.
  - في المقلاة نفسها قلّب البصل والثوم والفطر في باقي الزيت، ثم أضف الطماطم والأوريجانو والملح والفلفل، واتركها 10 دقائق.
  - أضف السبانخ والدجاج والمعكرونة إلى الصلصة وقلّبها دقيقتين.
  - قدّمها ساخنة وعليها الموزاريلا المبشورة والريحان.
- ref_external: NG-L64
  dish_form: ONE_DISH
  steps_ar:
  - اسلق المعكرونة في ماء مغلي حسب الوقت على العبوة، ثم صفّها (الماء الذي تمتصه المعكرونة محسوب، وماء السلق لا يُحسب).
  - قطّع الكوسا والفلفل والفطر قطعًا صغيرة، وقلّبها مع البصل والثوم في الزيت 5 دقائق.
  - أضف الطماطم والأوريجانو والملح والفلفل، واتركها 10 دقائق.
  - اخلط المعكرونة مع الصلصة، وقدّمها وعليها الموزاريلا المبشورة والريحان.
