condition_nutrient_limits:
- condition: HYPERTENSION
  nutrient: sodium
  limit_basis: ABSOLUTE
  max_per_day: 2000
  source_reference: 'WHO (2012). Guideline: Sodium intake for adults and children. < 2 g sodium/day'
  severity_note: PENDING dietitian review (PROJECT_CONTEXT §30, Expert validation)
- condition: HEART_DISEASE
  nutrient: sodium
  limit_basis: ABSOLUTE
  max_per_day: 2300
  source_reference: AHA (2021). Dietary Guidance to Improve Cardiovascular Health. <= 2300 mg sodium/day
  severity_note: PENDING dietitian review (PROJECT_CONTEXT §30, Expert validation)
- condition: HEART_DISEASE
  nutrient: saturated_fat
  limit_basis: PERCENT_ENERGY
  max_per_day: 6
  source_reference: AHA/ACC (2013). Guideline on Lifestyle Management to Reduce Cardiovascular Risk. 5-6% of energy from saturated fat
  severity_note: PENDING dietitian review (PROJECT_CONTEXT §30, Expert validation)
- condition: HEART_DISEASE
  nutrient: cholesterol
  limit_basis: ABSOLUTE
  max_per_day: 200
  source_reference: NCEP ATP III (2002). Therapeutic Lifestyle Changes diet. < 200 mg cholesterol/day
  severity_note: PENDING dietitian review (PROJECT_CONTEXT §30, Expert validation)
- condition: DIABETES_T2
  nutrient: carbohydrate
  limit_basis: ABSOLUTE
  max_per_meal: 60
  source_reference: 'ADA carbohydrate-counting education: 45-60 g carbohydrate per meal for most adults'
  severity_note: PENDING dietitian review (PROJECT_CONTEXT §30, Expert validation)
- condition: DIABETES_T2
  nutrient: sugars
  limit_basis: PERCENT_ENERGY
  max_per_day: 10
  source_reference: 'WHO (2015). Guideline: Sugars intake for adults and children. < 10% of energy (free sugars; applied here to total sugars, which is stricter - see Decision #69)'
  severity_note: PENDING dietitian review (PROJECT_CONTEXT §30, Expert validation)
- condition: DIABETES_T2
  nutrient: fiber
  limit_basis: ABSOLUTE
  min_per_day: 25
  source_reference: 'ADA Standards of Care in Diabetes (2024), section 5: at least 14 g fiber per 1000 kcal (about 25 g/day)'
  severity_note: PENDING dietitian review (PROJECT_CONTEXT §30, Expert validation)
