# Alembic configuration. The database URL is NOT set here: alembic/env.py reads it from
# app.core.config.get_settings().DATABASE_URL (environment / repository-root .env, §34.1).

[alembic]
script_location = %(here)s/alembic
# Makes the `app` package importable from env.py.
prepend_sys_path = .
path_separator = os

[post_write_hooks]

# Logging configuration (consumed by alembic/env.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
